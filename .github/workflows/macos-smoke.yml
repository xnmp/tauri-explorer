# macOS launch qualification (#192, #688): the automated real-process signal
# available without UI automation. Builds embedded assets and records
# bounded release foreground-readiness and hidden warm-activation p50/p95.
# Native log timing does not qualify presented frames or Dock-bounce/input latency.
# The separate macos-native-ui workflow pilots Appium Mac2/XCTest outcomes.
name: macOS Smoke

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  # Merge queue (#1133). head_ref is empty for merge_group, so the concurrency
  # group falls back to the entry's unique gh-readonly-queue/... ref and queue
  # entries never cancel each other or a PR run.
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  # Queue tier (#1133): skipped, and therefore passing, on PRs so the
  # required `launch-smoke` context stays satisfiable there; it runs in the
  # merge queue, on dev and on demand, where every event counts as code.
  launch-smoke:
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: macos-smoke-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build app and record exact qualification provenance
        id: build
        env:
          # The macOS process probe needs production code, not WebDriver hooks.
          NATIVE_QUALIFICATION_E2E_HOOKS: "0"
          NATIVE_QUALIFICATION_PROFILE: "release"
        run: bun run build:native:qualification

      # Foreground readiness ends after settings, commands, the initial listing,
      # two frame opportunities, and native IPC receipt. Correlated markers
      # retain each phase and any unexplained remainder without calling the
      # browser frame callbacks presented pixels or a Dock bounce.
      - name: Measure release foreground startup without a probe window
        env:
          MAC_STARTUP_SAMPLES: "30"
          MAC_STARTUP_TIMEOUT_MS: "30000"
          MAC_STARTUP_WARM_MEASURE: "0"
          MAC_STARTUP_OUTPUT_DIR: qualification-results/macos-startup/foreground
        run: bun run test:qualify:macos-startup

      # WARM_MEASURE uses the app's real hidden WKWebView activation probe. Keep
      # hidden-window activation separate so its work and ownership do not
      # contaminate the foreground-only distribution.
      - name: Measure real macOS warm activation
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          MAC_STARTUP_SAMPLES: "30"
          MAC_STARTUP_TIMEOUT_MS: "30000"
          MAC_STARTUP_WARM_MEASURE: "1"
          MAC_STARTUP_OUTPUT_DIR: qualification-results/macos-startup/warm-probe
        run: bun run test:qualify:macos-startup

      - name: Upload macOS startup qualification
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-startup-qualification
          path: qualification-results/macos-startup/
          if-no-files-found: error
