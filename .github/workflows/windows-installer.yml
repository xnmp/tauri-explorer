name: Windows installer

on:
  push:
    branches: [dev]
    # Path-scoped on dev pushes (#1801); the nightly schedule and dispatch
    # run regardless, catching anything outside these paths within a day.
    # The installer script, the README command it is pinned to, and the
    # one Vitest file (with its config and setup) that runs it.
    paths:
      - "windows_install.ps1"
      - "README.md"
      - "tests/windows-install-script.test.ts"
      - "tests/setup.ts"
      - "tests/serial-unit-files.ts"
      - "vitest.config.ts"
      - "svelte.config.js"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/windows-installer.yml"
  schedule:
    - cron: "13 5 * * *"
  workflow_dispatch:

# PRs share a group per PR ref and dev pushes one group per workflow, both
# cancelling in progress: a newer commit cancels its superseded run (#1798).
# Every other event (main pushes, schedule, dispatch) gets a unique run-ID
# group, so it never cancels or replaces another run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || (github.event_name == 'push' && github.ref == 'refs/heads/dev') && 'dev-push' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/dev') }}

jobs:
  invocation:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bunx vitest run tests/windows-install-script.test.ts
