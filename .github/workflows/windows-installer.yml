name: Windows installer

on:
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  invocation:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bunx vitest run tests/windows-install-script.test.ts
