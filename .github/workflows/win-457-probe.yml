# Temporary diagnostic for #457. Delete with scripts/win-session-probe.mjs
# once the Windows smoke leg is fixed.
#
# The Windows leg fails at POST /session, and each theory previously cost a
# full ~12-minute build plus a 15-minute suite, serially. This builds the
# binary ONCE, then fans every hypothesis out as a parallel job that only asks
# "does a session get created?" — seconds instead of a suite.
name: "#457 Windows session probe"

on:
  # Push-triggered because workflow_dispatch requires the file to exist on the
  # default branch, and this is throwaway diagnostic scaffolding that must not
  # land on dev. A push trigger runs the workflow from the branch's own file.
  push:
    branches: [fix/windows-tauri-smoke-hang]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-registry-
      - name: Cache Rust target
        uses: actions/cache@v6
        with:
          path: src-tauri/target
          key: ${{ runner.os }}-target-debug-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-target-debug-
      - run: bun install --frozen-lockfile
        shell: bash
      - name: Build Tauri binary (debug, embedded frontend)
        shell: bash
        env:
          VITE_E2E_HOOKS: "1"
        run: bun run tauri build --debug --no-bundle
      - uses: actions/upload-artifact@v7
        with:
          name: win-debug-binary
          path: src-tauri/target/debug/tauri-explorer.exe
          retention-days: 1

  probe:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        variant:
          - baseline-tauri-driver
          - direct-webview2
          - direct-webview2-args
          - direct-edge-browser-driver
          - attach-debugger-address
          - sanity-plain-edge
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: win-debug-binary
          path: src-tauri/target/debug

      # Only the control variant needs tauri-driver; installing it costs
      # minutes, so the other five skip it entirely.
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.variant == 'baseline-tauri-driver'
      - name: Install tauri-driver
        if: matrix.variant == 'baseline-tauri-driver'
        shell: bash
        run: cargo install tauri-driver --locked

      - name: Install msedgedriver matching the WebView2 runtime
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $runtime = (Get-ItemProperty $key).pv
          Write-Host "WebView2 runtime version: $runtime"
          # Record the Edge browser version too: if these majors differ, the
          # version-matching step is a suspect in its own right.
          $edge = (Get-ItemProperty 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{56EB18F8-B008-4CBD-B6D2-8C97FE7E9062}' -ErrorAction SilentlyContinue).pv
          Write-Host "Edge browser version:    $edge"
          Invoke-WebRequest "https://msedgedriver.microsoft.com/$runtime/edgedriver_win64.zip" -OutFile edgedriver.zip
          Expand-Archive edgedriver.zip -DestinationPath "$env:RUNNER_TEMP\edgedriver" -Force
          "PROBE_MSEDGEDRIVER=$env:RUNNER_TEMP\edgedriver\msedgedriver.exe" >> $env:GITHUB_ENV

      - name: Probe (${{ matrix.variant }})
        timeout-minutes: 5
        shell: bash
        run: node scripts/win-session-probe.mjs "${{ matrix.variant }}"

      - name: Upload driver log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: probe-logs-${{ matrix.variant }}
          path: e2e-tauri/logs/
          if-no-files-found: ignore
