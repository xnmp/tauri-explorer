name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

# Only PRs share a group. Unique non-PR groups preserve every dev run,
# including pending runs that GitHub would otherwise replace.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Docs-only PRs skip the heavy suites. Required status contexts must still
  # report, and a skipped matrix job never expands its contexts, so required
  # jobs keep running and gate their steps on this output instead. Anything not
  # matching the docs patterns, and every non-PR event, counts as code.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    # Per-tier test selection (#1175). Every selector reads only the git diff,
    # never PR text, labels or author claims, and any doubt runs that tier in
    # full: a failed selector, an unknown file type, an unusual path, or more
    # than TEST_SELECTION_MAX_FILES changed files.
    env:
      TEST_SELECTION_MAX_FILES: 50
    outputs:
      code: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.code }}
      # Browser specs a PR can affect (scripts/e2e-affected.mjs, #1131): "ALL",
      # "NONE" or space-separated e2e/ spec paths. Every non-PR event runs ALL,
      # so dev keeps full Chromium and WebKit coverage after each merge.
      e2e: ${{ github.event_name == 'pull_request' && steps.select.outputs.e2e || 'ALL' }}
      e2e-reason: ${{ github.event_name == 'pull_request' && steps.select.outputs.e2e-reason || format('{0} event runs every test', github.event_name) }}
      # Vitest inputs for `vitest related` (scripts/unit-affected.mjs): "ALL",
      # "NONE" or space-separated repo paths.
      unit: ${{ github.event_name == 'pull_request' && steps.select.outputs.unit || 'ALL' }}
      unit-reason: ${{ github.event_name == 'pull_request' && steps.select.outputs.unit-reason || format('{0} event runs every test', github.event_name) }}
      # Cargo packages for `cargo test -p` (scripts/rust-affected.mjs): "ALL",
      # "NONE" or space-separated workspace member names.
      rust: ${{ github.event_name == 'pull_request' && steps.select.outputs.rust || 'ALL' }}
      rust-reason: ${{ github.event_name == 'pull_request' && steps.select.outputs.rust-reason || format('{0} event runs every test', github.event_name) }}
    steps:
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          # A file is code unless it matches a docs exclusion.
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!**/*.md'
              - '!output/**'

      # The PR merge commit's first parent is the base tip, so HEAD^1...HEAD is
      # exactly the PR's change. Any selector failure falls back to ALL.
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2

      # Each selector prints {mode, reason, items} JSON; a selector or parse
      # failure selects the full tier. rust-affected runs `cargo metadata`
      # (the runner image's cargo) only when a change reaches Rust.
      - id: select
        if: github.event_name == 'pull_request'
        run: |
          select_tier() {
            local tier=$1 json mode
            shift
            if ! json=$(node "$@" --json --max-files "$TEST_SELECTION_MAX_FILES" HEAD^1 HEAD) ||
               ! mode=$(jq -er '.mode' <<< "$json"); then
              json='{"mode":"all","reason":"selection failed","items":[]}'
              mode=all
            fi
            case "$mode" in
              all) selection=ALL ;;
              none) selection=NONE ;;
              *) selection=$(jq -r '.items | join(" ")' <<< "$json") ;;
            esac
            reason=$(jq -r '.reason' <<< "$json")
            echo "$tier=${selection:-NONE}" >> "$GITHUB_OUTPUT"
            echo "$tier-reason=$reason" >> "$GITHUB_OUTPUT"
            echo "$tier: ${selection:-NONE} ($reason)"
            echo "- **$tier**: \`${selection:-NONE}\` — $reason" >> "$GITHUB_STEP_SUMMARY"
          }
          echo "### Test selection (limit $TEST_SELECTION_MAX_FILES changed files)" >> "$GITHUB_STEP_SUMMARY"
          select_tier e2e scripts/e2e-affected.mjs --strict
          select_tier unit scripts/unit-affected.mjs
          select_tier rust scripts/rust-affected.mjs

  # Code maps are only useful while they are accurate: an agent that trusts a map
  # naming a moved file searches worse than one with no map at all. Two guards —
  # references (every file a map names exists) and coverage (every source file is
  # in map-folder.md, so new files can't go unmapped).
  code-maps:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Validate code maps (references + coverage)
        run: python3 docs/code-map/validate.py --coverage

  frontend-checks:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Root type checks and relay tests import website/api/report.js, whose
      # Blob client belongs to the independently deployed website package.
      - name: Install website dependencies
        run: bun install --cwd website --frozen-lockfile

      - name: Type check
        run: bun run check

      - name: Architecture boundaries
        run: bun run lint:arch

      - name: Startup bundle budget
        run: bun run check:bundle

      # PRs run only the tests whose import graph reaches a changed file, or
      # that read it as text (scripts/unit-affected.mjs); other events run all.
      - name: Unit tests
        env:
          UNIT_SELECTION: ${{ needs.changes.outputs.unit }}
          UNIT_REASON: ${{ needs.changes.outputs.unit-reason }}
        run: |
          case "$UNIT_SELECTION" in
            ALL)
              echo "Unit tests: full suite ($UNIT_REASON)"
              bun run test ;;
            NONE)
              echo "Unit tests: none selected ($UNIT_REASON)" ;;
            *)
              echo "Unit tests: selected subset ($UNIT_REASON): tests related to $UNIT_SELECTION"
              read -ra inputs <<< "$UNIT_SELECTION"
              bunx vitest related --run --passWithNoTests "${inputs[@]}"
              bunx vitest related --run --passWithNoTests -c vitest.perf.config.ts "${inputs[@]}" ;;
          esac

  # Keep one browser worker per runner; split the growing suite across runners
  # so contention-sensitive tests retain their existing execution conditions.
  # Two shards of 561 tests ran 19-20m and began hitting the timeout.
  # Shards are whole spec files balanced by recorded CI duration
  # (scripts/e2e-shards.mjs, #1123): Playwright's count-based --shard left one
  # shard ~1.8x longer than another, and the slowest shard sets wall time.
  chromium:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7

      # Plans only the specs this PR can affect (all of them outside PRs). A
      # shard left with nothing to run skips the remaining steps and passes.
      - name: Plan duration-balanced shard
        id: plan
        env:
          E2E_SELECTION: ${{ needs.changes.outputs.e2e }}
          E2E_REASON: ${{ needs.changes.outputs.e2e-reason }}
        run: |
          if [ "$E2E_SELECTION" = ALL ]; then
            echo "chromium E2E: full suite ($E2E_REASON)"
          else
            echo "chromium E2E: selected subset ($E2E_REASON)"
          fi
          tr ' ' '\n' <<< "$E2E_SELECTION" > "$RUNNER_TEMP/e2e-selection.txt"
          node scripts/e2e-shards.mjs plan --engine chromium --shard ${{ matrix.shard }}/${{ strategy.job-total }} --only "$RUNNER_TEMP/e2e-selection.txt" --out "$RUNNER_TEMP/e2e-shard.txt"
          if [ -s "$RUNNER_TEMP/e2e-shard.txt" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No affected chromium specs in this shard." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: oven-sh/setup-bun@v2
        if: steps.plan.outputs.run == 'true'
        with:
          bun-version: latest

      - name: Install dependencies
        if: steps.plan.outputs.run == 'true'
        run: bun install --frozen-lockfile

      - name: Install Playwright browser
        if: steps.plan.outputs.run == 'true'
        run: npx playwright install --with-deps chromium

      # Fails unless Playwright selects exactly the planned files; --test-list
      # silently runs nothing for an unresolvable entry.
      - name: Verify shard selection
        if: steps.plan.outputs.run == 'true'
        run: node scripts/e2e-shards.mjs verify --engine chromium --list "$RUNNER_TEMP/e2e-shard.txt"

      - name: E2E tests
        env:
          E2E_SELECTION: ${{ needs.changes.outputs.e2e }}
          E2E_REASON: ${{ needs.changes.outputs.e2e-reason }}
        run: |
          mode=$([ "$E2E_SELECTION" = ALL ] && echo "full suite" || echo "selected subset")
          if [ "${{ steps.plan.outputs.run }}" != true ]; then
            echo "E2E: nothing to run in this shard; $mode ($E2E_REASON)"
            exit 0
          fi
          echo "E2E: $mode ($E2E_REASON), shard of $(wc -l < "$RUNNER_TEMP/e2e-shard.txt") spec file(s)"
          npx playwright test --project=chromium --test-list "$RUNNER_TEMP/e2e-shard.txt" --reporter=line,html

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-chromium-${{ matrix.shard }}
          path: playwright-report/
          if-no-files-found: ignore

  # Preserve the protected-branch check name and require every Chromium shard.
  frontend:
    if: always()
    needs: [changes, frontend-checks, chromium]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Upstream jobs are skipped only on a docs-only PR; on code every one must
      # succeed, so a failed, cancelled or skipped shard still fails this check.
      - name: Require frontend validation and browser outcomes
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          CHECKS_RESULT: ${{ needs.frontend-checks.result }}
          CHROMIUM_RESULT: ${{ needs.chromium.result }}
        run: |
          test "$CHANGES_RESULT" = success
          if [ "$CODE" = true ]; then
            test "$CHECKS_RESULT" = success && test "$CHROMIUM_RESULT" = success
          else
            test "$CHECKS_RESULT" = skipped && test "$CHROMIUM_RESULT" = skipped
          fi

  # WebKit ≈ WKWebView — the closest automated proxy for the macOS webview
  # (no WKWebView WebDriver exists). Catches Safari-family CSS/JS breakage.
  webkit-tests:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # The full 777-test suite exceeded 40m, and two shards still ran 24-38m,
    # so runner contention pushed them past the bound (#932). Keep one worker
    # on each runner and the per-runner bound. Five duration-balanced shards
    # (~20m each from recorded CI timings, #1123) replace four count-based
    # ones whose slowest ran 30m.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v7

      # Plans only the specs this PR can affect (all of them outside PRs). A
      # shard left with nothing to run skips the remaining steps and passes.
      - name: Plan duration-balanced shard
        id: plan
        env:
          E2E_SELECTION: ${{ needs.changes.outputs.e2e }}
          E2E_REASON: ${{ needs.changes.outputs.e2e-reason }}
        run: |
          if [ "$E2E_SELECTION" = ALL ]; then
            echo "webkit E2E: full suite ($E2E_REASON)"
          else
            echo "webkit E2E: selected subset ($E2E_REASON)"
          fi
          tr ' ' '\n' <<< "$E2E_SELECTION" > "$RUNNER_TEMP/e2e-selection.txt"
          node scripts/e2e-shards.mjs plan --engine webkit --shard ${{ matrix.shard }}/${{ strategy.job-total }} --only "$RUNNER_TEMP/e2e-selection.txt" --out "$RUNNER_TEMP/e2e-shard.txt"
          if [ -s "$RUNNER_TEMP/e2e-shard.txt" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No affected webkit specs in this shard." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: oven-sh/setup-bun@v2
        if: steps.plan.outputs.run == 'true'
        with:
          bun-version: latest

      - name: Install dependencies
        if: steps.plan.outputs.run == 'true'
        run: bun install --frozen-lockfile

      - name: Install Playwright WebKit
        if: steps.plan.outputs.run == 'true'
        run: npx playwright install --with-deps webkit

      # Fails unless Playwright selects exactly the planned files; --test-list
      # silently runs nothing for an unresolvable entry.
      - name: Verify shard selection
        if: steps.plan.outputs.run == 'true'
        env:
          WEBKIT: "1"
        run: node scripts/e2e-shards.mjs verify --engine webkit --list "$RUNNER_TEMP/e2e-shard.txt"

      - name: E2E tests (WebKit)
        env:
          WEBKIT: "1"
          PW_VIDEO_HEADED: "1"
          E2E_SELECTION: ${{ needs.changes.outputs.e2e }}
          E2E_REASON: ${{ needs.changes.outputs.e2e-reason }}
        # Only video decoder specs opt into GTK; other specs retain headless WPE.
        # The display belongs to this hosted runner and is destroyed after testing.
        run: |
          mode=$([ "$E2E_SELECTION" = ALL ] && echo "full suite" || echo "selected subset")
          if [ "${{ steps.plan.outputs.run }}" != true ]; then
            echo "WebKit E2E: nothing to run in this shard; $mode ($E2E_REASON)"
            exit 0
          fi
          echo "WebKit E2E: $mode ($E2E_REASON), shard of $(wc -l < "$RUNNER_TEMP/e2e-shard.txt") spec file(s)"
          xvfb-run -a --server-args="-screen 0 1920x1080x24 -nolisten tcp" npx playwright test --project=webkit --test-list "$RUNNER_TEMP/e2e-shard.txt" --reporter=line,html

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-webkit-${{ matrix.shard }}
          path: playwright-report/
          if-no-files-found: ignore

  # WebKit is also a protected context: every shard must complete successfully.
  webkit:
    if: always()
    needs: [changes, webkit-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all WebKit browser outcomes
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          WEBKIT_RESULT: ${{ needs.webkit-tests.result }}
        run: |
          test "$CHANGES_RESULT" = success
          if [ "$CODE" = true ]; then
            test "$WEBKIT_RESULT" = success
          else
            test "$WEBKIT_RESULT" = skipped
          fi

  # The default-feature and opt-in feature suites each compile a different lib
  # test binary and run the full ~6 min lib suite, so run them on parallel
  # runners rather than back to back (#1123). Both stay full passes:
  # `not(feature = "durable-recovery")` tests exist only in the default suite.
  rust-suite:
    name: rust-suite (${{ matrix.suite }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # A cold cache build plus the lib suite has exceeded 30 minutes.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # --features avif keeps the (default-off) AVIF code linted and
          # tested; this runner has a current dav1d. The release build ships
          # without it.
          - suite: default
            clippy-features: avif
            test-features: avif
          # Keep the deferred recovery policy verified without enabling it in
          # release artifacts. Default-policy capacity coverage runs in the
          # default suite. durable-recovery is read only on Linux, like this
          # runner (ADR 0020). e2e-hooks (#884) rides along so the hook-build
          # branches are linted and unit-tested on Linux too; it is absent
          # from release artifacts.
          - suite: opt-in
            clippy-features: avif,durable-recovery,e2e-renderer-recovery,e2e-hooks
            test-features: avif,durable-recovery,e2e-hooks
    env:
      RUST_SELECTION: ${{ needs.changes.outputs.rust }}
      RUST_REASON: ${{ needs.changes.outputs.rust-reason }}
    steps:
      - uses: actions/checkout@v7

      # nasm: required by turbojpeg-sys (x86 SIMD assembler).
      # libdav1d-dev: AVIF decode (image avif-native, Linux-only feature).
      - name: Install Tauri Linux system dependencies
        if: env.RUST_SELECTION != 'NONE'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev nasm libdav1d-dev

      - uses: dtolnay/rust-toolchain@stable
        if: env.RUST_SELECTION != 'NONE'
        with:
          components: rustfmt, clippy

      # Each suite builds different feature artifacts; separate cache keys
      # keep the two matrix jobs from overwriting each other's target dir.
      # Save only from dev so PR branches restore dev's caches instead of
      # adding ~1.5 GB entries each and evicting other workflows' caches.
      - uses: Swatinem/rust-cache@v2
        if: env.RUST_SELECTION != 'NONE'
        with:
          workspaces: src-tauri
          key: ${{ matrix.suite }}
          save-if: ${{ github.ref == 'refs/heads/dev' }}

      # tauri::generate_context! requires the frontendDist dir to exist.
      - name: Create empty frontend dist
        if: env.RUST_SELECTION != 'NONE'
        run: mkdir -p build

      - name: Format check
        if: matrix.suite == 'default' && env.RUST_SELECTION != 'NONE'
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Clippy
        if: env.RUST_SELECTION != 'NONE'
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --features ${{ matrix.clippy-features }} -- -D warnings

      # PRs test only the packages the diff touches plus their dependents
      # (scripts/rust-affected.mjs, from cargo metadata); NONE also skips the
      # toolchain, build and clippy steps above. Other events run everything.
      - name: Rust tests
        run: |
          case "$RUST_SELECTION" in
            ALL)
              echo "Rust tests: full suite ($RUST_REASON)"
              cargo test --manifest-path src-tauri/Cargo.toml --features ${{ matrix.test-features }} ;;
            NONE)
              echo "Rust tests: none selected ($RUST_REASON)" ;;
            *)
              echo "Rust tests: selected packages $RUST_SELECTION ($RUST_REASON)"
              packages=()
              for p in $RUST_SELECTION; do packages+=(-p "$p"); done
              cargo test --manifest-path src-tauri/Cargo.toml --features ${{ matrix.test-features }} "${packages[@]}" ;;
          esac

  # Preserve the protected-branch check name and require every Rust suite.
  rust:
    if: always()
    needs: [changes, rust-suite]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Skipped only on a docs-only PR; on code every suite must succeed, so a
      # failed, cancelled or skipped suite still fails this check.
      - name: Require all Rust suite outcomes
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          RUST_RESULT: ${{ needs.rust-suite.result }}
        run: |
          test "$CHANGES_RESULT" = success
          if [ "$CODE" = true ]; then
            test "$RUST_RESULT" = success
          else
            test "$RUST_RESULT" = skipped
          fi
