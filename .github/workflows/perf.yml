name: Performance Tests

# Not a required check, so it runs after merge rather than on PRs (tauri#1133).
on:
  push:
    branches: [dev]
  workflow_dispatch:

env:
  # Bun for the Playwright container job; must equal ci.yml's pin
  # (tests/ci-playwright-container.test.ts).
  CONTAINER_BUN_VERSION: "1.4.3"

# PRs share a group per PR ref and dev pushes one group per workflow, both
# cancelling in progress: a newer commit cancels its superseded run (#1798).
# Every other event (main pushes, schedule, dispatch) gets a unique run-ID
# group, so it never cancels or replaces another run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || (github.event_name == 'push' && github.ref == 'refs/heads/dev') && 'dev-push' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/dev') }}

jobs:
  perf-check:
    name: Performance Regression Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run performance benchmarks
        run: bun run perf:check

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-results
          path: perf-baseline.json
          if-no-files-found: ignore

  tiles-scroll-perf:
    name: Tiles Scroll Perf (#593 regression guard)
    runs-on: ubuntu-latest
    # Playwright refuses ubuntu-latest's Ubuntu 26.04 host ("does not support
    # chromium on ubuntu26.04-x64"). The pinned Playwright image carries the
    # browser and its libraries, like ci.yml's browser jobs; its tag must equal
    # bun.lock's @playwright/test version (tests/ci-playwright-container.test.ts).
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble@sha256:9bd26ad900bb5e0f4dee75839e957a89ae89c2b7ab1e76050e559790e946b948
      # Chromium needs more shared memory than Docker's 64 MB default.
      options: --ipc=host
    # Steps use bash features; do not fall back to sh.
    defaults:
      run:
        shell: bash
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # The container runs as root over a runner-owned checkout.
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install bun
        run: |
          npm install --global --ignore-scripts "@oven/bun-linux-x64@${CONTAINER_BUN_VERSION}"
          ln -sf "$(npm root --global)/@oven/bun-linux-x64/bin/bun" /usr/local/bin/bun
          ln -sf /usr/local/bin/bun /usr/local/bin/bunx
          test "$(bun --version)" = "$CONTAINER_BUN_VERSION"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Tiles scroll perf spec
        run: npx playwright test e2e/tiles-scroll-perf.spec.ts --project=chromium

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-tiles-scroll-perf
          path: playwright-report/
          if-no-files-found: ignore
