name: Performance Tests

on:
  # Queue tier (#1133): the jobs below never run for a pull request; they run
  # in the merge queue, on dev and on demand. The unfiltered pull_request
  # trigger exists only so each job posts a skipped, and therefore passing,
  # check that the ruleset can require without blocking PRs.
  pull_request:
  push:
    branches: [dev]
    paths:
      - 'src/lib/state/**'
      - 'src/lib/domain/**'
      - 'src/lib/components/**'
      - 'src/lib/api/**'
      - 'src/lib/composables/**'
      - 'tests/perf/**'
      - 'scripts/perf-check.ts'
      - 'perf-baseline.json'
      - 'e2e/tiles-scroll-perf.spec.ts'
  # Merge queue (#1133). head_ref is empty for merge_group, so the concurrency
  # group falls back to the entry's unique gh-readonly-queue/... ref and queue
  # entries never cancel each other or a PR run.
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  # merge_group ignores trigger-level paths, so queue runs apply the push
  # list here (keep it in sync). Runs only for merge_group; a failure leaves
  # the output empty, which the gated jobs treat as changed.
  changes:
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.paths.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
      - id: paths
        uses: ./.github/actions/merge-group-paths
        with:
          patterns: |
            src/lib/state/**
            src/lib/domain/**
            src/lib/components/**
            src/lib/api/**
            src/lib/composables/**
            tests/perf/**
            scripts/perf-check.ts
            perf-baseline.json
            e2e/tiles-scroll-perf.spec.ts

  perf-check:
    name: Performance Regression Check
    needs: changes
    if: ${{ !cancelled() && github.event_name != 'pull_request' && (github.event_name != 'merge_group' || needs.changes.outputs.run != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run performance benchmarks
        run: bun run perf:check

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-results
          path: perf-baseline.json
          if-no-files-found: ignore

  tiles-scroll-perf:
    name: Tiles Scroll Perf (#593 regression guard)
    needs: changes
    if: ${{ !cancelled() && github.event_name != 'pull_request' && (github.event_name != 'merge_group' || needs.changes.outputs.run != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run Tiles scroll perf spec
        run: npx playwright test e2e/tiles-scroll-perf.spec.ts --project=chromium

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-tiles-scroll-perf
          path: playwright-report/
          if-no-files-found: ignore
