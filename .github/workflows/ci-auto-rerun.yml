name: CI auto-rerun

# Re-runs the failed jobs of a failed first attempt once, only when every
# failed job stopped at an install or setup step (#1367). The decision is
# scripts/ci-jobs.mjs auto-rerun; it reads job metadata only and never checks
# out or runs the triggering run's code. workflow_run uses this file from the
# default branch (dev), so changes here take effect after they merge.
# A pull_request run is re-run only while it is the newest run of its
# workflow for the branch and the PR head is still its head_sha; a dev push
# run only while it is the newest dev push run of its workflow and dev's head
# is still its head_sha (#1798). A superseded run that was cancelled concludes
# `cancelled` and never reaches the re-run job.
# macOS Smoke is included because hosted macOS arm64 capacity runs short: a
# job GitHub never hands to a runner fails with no steps, which counts as a
# setup failure and gets its one re-run (#1810).
on:
  workflow_run:
    workflows: [CI, "Tauri binary E2E (smoke)", "macOS Smoke"]
    types: [completed]

# actions: write for the re-run request; contents: read to check out scripts/
# from the default branch and read dev's head; pull-requests: read to confirm
# a PR run is still the PR's current run (a re-run joins the PR's or dev's
# cancel-in-progress group and would otherwise cancel the run for a newer
# commit).
permissions:
  actions: write
  contents: read
  pull-requests: read

jobs:
  rerun:
    # Attempt 1 only: a re-run's own completion (attempt 2) never re-runs.
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts

      - name: Re-run install/setup failures once
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: node scripts/ci-jobs.mjs auto-rerun
