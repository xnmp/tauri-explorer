name: Build & Release

on:
  push:
    branches: [main]

permissions:
  contents: write

# One release at a time: the update channel check and upload must not
# interleave with another release's (#1783). GitHub replaces a pending run in
# the group with a newer one; release merges are rare and supervised, and a
# superseded run's version stays untagged, which version-check reports.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version-check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag_exists: ${{ steps.check.outputs.exists }}
    steps:
      - uses: actions/checkout@v7
      - id: ver
        run: echo "version=v$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"
      - id: check
        run: |
          if git ls-remote --tags origin "${{ steps.ver.outputs.version }}" | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  # PRs into main do not run CI (#1367); the code's dev push did. Before
  # anything is built or tagged, require a dev commit with this exact tree to
  # have a successful dev push CI run and native smoke (waiting for a dev run
  # still in progress). Runs only when a release would happen: a push to main
  # whose version is already tagged builds nothing. A tree that never reached
  # dev (a direct main commit) cannot be released. release-gate.yml runs the
  # same check on the PR into main.
  dev-ci-gate:
    needs: version-check
    if: needs.version-check.outputs.tag_exists == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require a successful dev push CI run for this tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --no-tags origin +refs/heads/dev:refs/remotes/origin/dev
          node scripts/release-ci-gate.mjs --wait-minutes 60

  build:
    needs: [version-check, dev-ci-gate]
    if: needs.version-check.outputs.tag_exists == 'false'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact-name: linux-bundles
            artifact-paths: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/deb/*.deb.sig
              src-tauri/target/release/bundle/rpm/*.rpm
              src-tauri/target/release/bundle/rpm/*.rpm.sig
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/appimage/*.AppImage.sig
          - os: macos-latest
            artifact-name: macos-arm64-bundles
            rust-target: aarch64-apple-darwin
            tauri-args: --target aarch64-apple-darwin
            artifact-paths: |
              src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
              src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz
              src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
          - os: windows-latest
            artifact-name: windows-bundles
            artifact-paths: |
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/msi/*.msi.sig
              src-tauri/target/release/bundle/nsis/*-setup.exe
              src-tauri/target/release/bundle/nsis/*-setup.exe.sig
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Cache cargo registry and tauri-cli
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-tauri
            ~/.cargo/bin/cargo-tauri.exe
          key: ${{ runner.os }}-cargo-tauri-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-tauri-

      - name: Install tauri-cli
        shell: bash
        run: cargo install tauri-cli --locked || true

      # Bounded and cached (#1371): a stalled mirror fails here, in setup.
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        timeout-minutes: 25
        uses: ./.github/actions/tauri-linux-deps
        with:
          packages: >-
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev
            patchelf libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
            nasm

      # bun.lock records optional packages for every supported platform and
      # selects the matching binaries on each runner. Keep it so the Tauri API
      # minor version stays aligned with the Rust crate during release builds.
      - name: Install frontend dependencies
        shell: bash
        run: bun install --frozen-lockfile

      # Self-update signatures (#1679, docs/auto-update.md). Installed apps
      # trust only this key's public half (tauri.conf.json plugins.updater),
      # so a release without it would strand every self-updating install.
      - name: Require the updater signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [[ -z "$TAURI_SIGNING_PRIVATE_KEY" ]]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not configured (docs/auto-update.md)"
            exit 1
          fi

      - name: Build Tauri app
        if: runner.os != 'macOS'
        shell: bash
        # linuxdeploy (AppImage) runs `strip` on the binary unless NO_STRIP is
        # set, which would discard the symbol table Cargo's
        # `strip = "debuginfo"` keeps for readable panic backtraces (#1682).
        # Only linuxdeploy reads it; the Windows build ignores it.
        env:
          NO_STRIP: "true"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: cargo tauri build ${{ matrix.tauri-args }} --config src-tauri/tauri.updater.conf.json

      # Developer ID signing + notarization of the .app and DMG (#1671). The
      # script fails closed once credentials exist; with none it builds an
      # unsigned DMG and warns, unless the repository variable
      # MACOS_REQUIRE_SIGNING is 1. Setup and renewal: docs/macos-signing.md.
      - name: Build, sign and notarize Tauri app (macOS)
        if: runner.os == 'macOS'
        shell: bash
        timeout-minutes: 120
        env:
          REQUIRE_SIGNING: ${{ vars.MACOS_REQUIRE_SIGNING }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: scripts/macos-release-build.sh ${{ matrix.rust-target }} --config src-tauri/tauri.updater.conf.json

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-paths }}
          if-no-files-found: error

  release:
    needs: [version-check, dev-ci-gate, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Validate release asset matrix
        shell: bash
        env:
          VERSION: ${{ needs.version-check.outputs.version }}
        run: |
          set -euo pipefail
          version=${VERSION#v}
          version_regex=${version//./[.]}
          # These names and architectures are the output of this build matrix.
          # Check every selected file, including duplicates, before publishing.
          for pattern in '*.deb' '*.rpm' '*.AppImage' '*.dmg' '*.msi' '*-setup.exe'; do
            mapfile -d '' -t matches < <(find artifacts -type f -name "$pattern" -print0)
            if (( ${#matches[@]} != 1 )); then
              echo "::error::Expected exactly one release bundle matching $pattern; found ${#matches[@]}"
              exit 1
            fi
            for asset in "${matches[@]}"; do
              filename=$(basename "$asset")
              case "$pattern" in
                '*.deb') expected="tauri-explorer_${version}_amd64.deb" ;;
                '*.AppImage') expected="tauri-explorer_${version}_amd64.AppImage" ;;
                '*.dmg') expected="tauri-explorer_${version}_aarch64.dmg" ;;
                '*.msi') expected="tauri-explorer_${version}_x64_en-US.msi" ;;
                '*-setup.exe') expected="tauri-explorer_${version}_x64-setup.exe" ;;
                '*.rpm') expected='' ;;
              esac
              if [[ "$pattern" == '*.rpm' ]]; then
                [[ "$filename" =~ ^tauri-explorer-${version_regex}-[0-9]+\.x86_64\.rpm$ ]] && continue
              elif [[ "$filename" == "$expected" ]]; then
                continue
              fi
              echo "::error::Release bundle has the wrong version: $asset"
              exit 1
            done
          done

      - name: Prepare release notes
        env:
          VERSION: ${{ needs.version-check.outputs.version }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from datetime import date
          from pathlib import Path

          version = os.environ['VERSION']
          changelog = Path('CHANGELOG.md').read_text()
          section = re.search(
              rf'(?ms)^## {re.escape(version)} — ([^\n]+)\n(.*?)(?=^## |\Z)',
              changelog,
          )
          if section is None:
              raise SystemExit(f'No changelog section for {version}')
          date_text, body = section.groups()
          if not re.fullmatch(r'\d{4}-\d{2}-\d{2}', date_text):
              raise SystemExit(f'Changelog entry for {version} must be dated')
          try:
              date.fromisoformat(date_text)
          except ValueError:
              raise SystemExit(f'Changelog entry for {version} must be dated')
          if not body.strip():
              raise SystemExit(f'Changelog entry for {version} is empty')
          Path('release-notes.md').write_text(body.strip() + '\n')
          PY

      # The macOS updater archive is named after the product only; give it
      # the versioned release-asset name its manifest entry points at.
      - name: Version the macOS updater archive
        shell: bash
        env:
          VERSION: ${{ needs.version-check.outputs.version }}
        run: |
          set -euo pipefail
          version=${VERSION#v}
          mapfile -d '' -t archives < <(find artifacts -type f -name '*.app.tar.gz' -print0)
          if (( ${#archives[@]} != 1 )); then
            echo "::error::Expected exactly one macOS updater archive; found ${#archives[@]}"
            exit 1
          fi
          dir=$(dirname "${archives[0]}")
          target="$dir/tauri-explorer_${version}_aarch64.app.tar.gz"
          mv "${archives[0]}" "$target"
          mv "${archives[0]}.sig" "$target.sig"

      - name: Build updater manifest
        env:
          VERSION: ${{ needs.version-check.outputs.version }}
        run: >-
          node scripts/updater-manifest.mjs --tag "$VERSION" --dir artifacts
          --notes release-notes.md --repo "$GITHUB_REPOSITORY" --out latest-alpha.json

      # The bridge and every later build read only update-channel's
      # latest-alpha.json (scripts/update-channel.mjs, #1783). Check it before
      # publishing anything, so a release that would move the channel back is
      # never created.
      - name: Check the update channel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version-check.outputs.version }}
        run: |
          set -euo pipefail
          channel=update-channel
          if ! names=$(gh release view "$channel" --json assets --jq '.assets[].name' 2>view-error.txt); then
            grep -qi 'release not found' view-error.txt || { cat view-error.txt >&2; exit 1; }
            gh release create "$channel" --prerelease --latest=false --target "$GITHUB_SHA" \
              --title "Update channel" \
              --notes "Not a release: installed copies of Tauri Explorer read latest-alpha.json here to find the newest release (#1783)."
            names=
          fi
          current=()
          if grep -qx latest-alpha.json <<<"$names"; then
            gh release download "$channel" --pattern latest-alpha.json --output channel-latest-alpha.json
            current=(--channel channel-latest-alpha.json)
          fi
          node scripts/update-channel.mjs check --version "$VERSION" "${current[@]}"

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version-check.outputs.version }}
        run: |
          set -euo pipefail
          # Re-running a job whose later step failed must not fail here.
          if state=$(gh release view "$VERSION" --json isDraft --jq .isDraft 2>view-error.txt); then
            if [[ $state == false ]]; then
              echo "$VERSION is already published; continuing with the update channel."
              exit 0
            fi
            echo "::error::$VERSION exists as a draft (an interrupted upload): check its assets, then publish or delete it and re-run."
            exit 1
          fi
          grep -qi 'release not found' view-error.txt || { cat view-error.txt >&2; exit 1; }
          # The signatures the updater manifest embeds are also published
          # beside each signed bundle.
          mapfile -t assets < <(find artifacts -type f \( \
            -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \
            -o -name '*.dmg' -o -name '*.app.tar.gz' \
            -o -name '*.msi' -o -name '*-setup.exe' -o -name '*.sig' \))
          assets+=(latest-alpha.json)
          # GitHub "Latest" stays on a release every 1.x install sees as newer
          # in plain version order (#1783); only such a release publishes the
          # latest.json that 1.26–1.28.1 self-updating installs read.
          latest=$(node scripts/update-channel.mjs github-latest "$VERSION")
          if [[ $latest == true ]]; then
            cp latest-alpha.json latest.json
            assets+=(latest.json)
          fi
          gh release create "$VERSION" \
            --title "$VERSION" \
            --latest="$latest" \
            --target "$GITHUB_SHA" \
            --notes-file release-notes.md \
            "${assets[@]}"

      # After the release exists, so the manifest never names missing assets.
      # --clobber deletes the old asset first: if this upload fails, installs
      # find no manifest (and offer nothing) until "Re-run failed jobs"
      # uploads it again.
      - name: Publish to the update channel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload update-channel latest-alpha.json --clobber

  # The Homebrew cask (#1876): `brew install --cask xnmp/tap/tauri-explorer`
  # installs this release. A job of its own, after the release exists, so a
  # tap failure leaves the release intact and "Re-run failed jobs" retries
  # only this. HOMEBREW_TAP_TOKEN is a fine-grained token with Contents
  # read/write on the tap repository alone; without it the job warns and
  # skips, so the tap stays on the previous release (installs still work and
  # then update themselves).
  homebrew:
    needs: [version-check, dev-ci-gate, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Update the Homebrew cask
        env:
          VERSION: ${{ needs.version-check.outputs.version }}
          TAP: ${{ github.repository_owner }}/homebrew-tap
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        shell: bash
        run: |
          if [[ -z $GH_TOKEN ]]; then
            echo "::warning::HOMEBREW_TAP_TOKEN is not set; the Homebrew cask in $TAP was not updated to $VERSION"
            exit 0
          fi
          version=${VERSION#v}
          dmg="tauri-explorer_${version}_aarch64.dmg"
          # Public release assets; the tap token only needs the tap.
          curl --fail --silent --show-error --location --retry 3 -o "$dmg" \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${VERSION}/${dmg}"
          node scripts/homebrew-cask.mjs "$version" "$dmg" > cask.rb
          path=Casks/tauri-explorer.rb
          sha=$(gh api "repos/$TAP/contents/$path" --jq .sha 2>/dev/null || true)
          args=(-X PUT "repos/$TAP/contents/$path" -f message="tauri-explorer $version" -f content="$(base64 -w0 cask.rb)")
          [[ -n $sha ]] && args+=(-f sha="$sha")
          gh api "${args[@]}" --jq '.commit.html_url'
