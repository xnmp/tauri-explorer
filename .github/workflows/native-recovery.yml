# Linux native recovery acceptance (#774). These suites need an opt-in build
# and fixture directories, so the smoke job skips them and WDIO counts each
# skipped spec file as passed. This job supplies both, and
# TAURI_E2E_REQUIRE_GATED=1 turns any remaining skip into a named failure.
name: Native recovery (Linux)

# A debug build with three features is ~12 minutes; changes that cannot
# reach the binary or the specs skip it.
on:
  pull_request:
    branches: [dev, main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "screenshots/**"
      - "evidence/**"
      - "website/**"
  push:
    branches: [dev, main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "screenshots/**"
      - "evidence/**"
      - "website/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable

      # Its own key: the feature set differs from the smoke build, so sharing
      # a target directory would rebuild the crate on every alternation.
      - name: Cache Rust target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: native-recovery

      # nasm: turbojpeg-sys. python3: the renderer-recovery harness.
      - name: Install Linux WebKit driver
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev webkit2gtk-driver xvfb openbox x11-utils \
            dbus-daemon nasm python3

      - name: Install tauri-driver
        run: cargo install tauri-driver --locked

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # The Tauri CLI embeds the hooks-enabled frontend (custom-protocol).
      # Warm priming stays off: the recovery fixture requires it.
      - name: Build Tauri binary with recovery features
        id: build
        env:
          VITE_E2E_HOOKS: "1"
          VITE_E2E_NO_WARM_PRIME: "1"
        run: >-
          bun run tauri build --debug --no-bundle
          --features e2e-renderer-recovery,durable-copy-recovery,durable-move-recovery

      # Move retirement needs source and target on different mounted
      # filesystems: tmpfs /dev/shm and the runner disk.
      - name: Prepare fixtures
        id: fixtures
        run: |
          root="$RUNNER_TEMP/native-recovery"
          mkdir -p "$root"/{file-recovery,move-target}
          for profile in fixture-profile history-profile; do
            mkdir -p "$root/$profile"/{config,data,cache,state,history-gate}
          done
          move_source="$(mktemp -d /dev/shm/native-move-source.XXXXXX)"
          source_device="$(stat -c %d "$move_source")"
          target_device="$(stat -c %d "$root/move-target")"
          if [ "$source_device" = "$target_device" ]; then
            echo "::error::move source and target share device $source_device"
            exit 1
          fi
          {
            echo "TAURI_E2E_MOVE_SOURCE_DIR=$move_source"
            echo "TAURI_E2E_MOVE_TARGET_DIR=$root/move-target"
            echo "TAURI_E2E_REQUIRE_GATED=1"
            echo "TAURI_E2E_DURABLE_MOVE_RECOVERY=1"
          } >> "$GITHUB_ENV"

      # Every launch with TAURI_E2E_FILE_RECOVERY_DIR set seeds its recovery
      # fixture there and refuses to overwrite one, so only this suite, which
      # consumes the seeded record, runs with it, in a profile of its own.
      # Each suite step has its own history gate directory, so arm files a
      # failed protocol leaves behind cannot reach a later step.
      - name: Run file recovery acceptance
        timeout-minutes: 15
        env:
          TAURI_E2E_FILE_RECOVERY_DIR: ${{ runner.temp }}/native-recovery/file-recovery
          TAURI_E2E_HISTORY_GATE_DIR: ${{ runner.temp }}/native-recovery/fixture-profile/history-gate
          XDG_CONFIG_HOME: ${{ runner.temp }}/native-recovery/fixture-profile/config
          XDG_DATA_HOME: ${{ runner.temp }}/native-recovery/fixture-profile/data
          XDG_CACHE_HOME: ${{ runner.temp }}/native-recovery/fixture-profile/cache
          XDG_STATE_HOME: ${{ runner.temp }}/native-recovery/fixture-profile/state
        run: >-
          GDK_BACKEND=x11 xvfb-run -a --server-args="-screen 0 1280x1024x24"
          dbus-run-session -- bash e2e-tauri/with-window-manager.sh
          bunx wdio run e2e-tauri/wdio.conf.ts
          --spec e2e-tauri/specs/file-recovery.spec.ts

      # The driver runs in its own process group. A step that timed out was
      # killed without its exit-time reaper, and a driver it left holds the
      # fixed WebDriver ports that every later session needs.
      - name: Reap native processes left by an earlier step
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.fixtures.outcome == 'success' }}
        run: |
          for name in tauri-driver WebKitWebDriver tauri-explorer; do
            pkill -KILL -x "$name" || true
          done

      - name: Run history and move recovery suites
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.fixtures.outcome == 'success' }}
        timeout-minutes: 25
        env:
          TAURI_E2E_HISTORY_GATE_DIR: ${{ runner.temp }}/native-recovery/history-profile/history-gate
          XDG_CONFIG_HOME: ${{ runner.temp }}/native-recovery/history-profile/config
          XDG_DATA_HOME: ${{ runner.temp }}/native-recovery/history-profile/data
          XDG_CACHE_HOME: ${{ runner.temp }}/native-recovery/history-profile/cache
          XDG_STATE_HOME: ${{ runner.temp }}/native-recovery/history-profile/state
        run: >-
          GDK_BACKEND=x11 xvfb-run -a --server-args="-screen 0 1280x1024x24"
          dbus-run-session -- bash e2e-tauri/with-window-manager.sh
          bunx wdio run e2e-tauri/wdio.conf.ts
          --spec e2e-tauri/specs/file-forward-history.spec.ts
          --spec e2e-tauri/specs/file-history-lifetime.spec.ts
          --spec e2e-tauri/specs/move-retirement.spec.ts
          --spec e2e-tauri/specs/cross-device-move-history.spec.ts

      # WebDriver sessions die with the renderer, so renderer crash recovery
      # has its own retained-WebView controller, which creates its own
      # isolated profile and fixture.
      # The driver runs in its own process group. A step that timed out was
      # killed without its exit-time reaper, and a driver it left holds the
      # fixed WebDriver ports that every later session needs.
      - name: Reap native processes left by the suites
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          for name in tauri-driver WebKitWebDriver tauri-explorer; do
            pkill -KILL -x "$name" || true
          done

      - name: Run renderer recovery harness
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 15
        run: >-
          GDK_BACKEND=x11 xvfb-run -a --server-args="-screen 0 1280x1024x24"
          dbus-run-session -- bash e2e-tauri/with-window-manager.sh
          bun run test:e2e:recovery

      - name: Upload logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: native-recovery-logs-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            e2e-tauri/logs/
            ${{ runner.temp }}/native-recovery/
          if-no-files-found: warn
