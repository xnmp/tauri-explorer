version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      routine-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      routine-dependencies:
        patterns:
          - "*"
    ignore:
      # Dependabot rewrites zip's `bzip2` feature to `bzip9` when it bumps the
      # requirement from 2 to 9, failing the whole job (#1497). A zip major
      # upgrade changes its API anyway, so it is migrated by hand.
      - dependency-name: "zip"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      routine-dependencies:
        patterns:
          - "*"
