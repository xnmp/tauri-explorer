name: Tauri binary E2E (smoke)

on:
  # Not main: release.yml requires this workflow's dev push smoke for the
  # released tree instead of re-running it on the dev->main PR (#1367).
  pull_request:
    branches: [dev]
  push:
    branches: [dev]
  # Scoped dispatches diagnose #715 and #710; only the default full run counts toward
  # the W2.4 five-run Windows smoke gate.
  workflow_dispatch:
    inputs:
      native_scope:
        description: Native suite scope for a manual diagnostic run
        type: choice
        required: true
        default: all
        options:
          - all
          - clipboard
          - transfer
      clipboard_runs:
        description: Fresh clipboard-spec sessions (1-10; clipboard scope only)
        type: number
        required: true
        default: 1

# Only PRs share a group. Unique non-PR groups preserve every dev run,
# including pending runs that GitHub would otherwise replace.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Note: macOS is deliberately omitted. Official `tauri-driver` has no
# WKWebView support (tauri-apps/tauri#7068). Re-add when a stable driver
# exists or if macOS regressions justify the CrabNebula subscription.
jobs:
  # Docs-only PRs skip the heavy suites. Required status contexts must still
  # report, and a skipped matrix job never expands its contexts, so required
  # jobs keep running and gate their steps on this output instead. Anything not
  # matching the docs patterns, and every non-PR event, counts as code.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.code }}
    steps:
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        with:
          # A file is code unless it matches a docs exclusion.
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!docs/**'
              # Root-level Markdown only: Markdown under e2e/, src/, tests/ and
              # elsewhere can be a fixture or a text contract, so it stays code.
              - '!*.md'
              - '!output/**'
              # Written by specs as issue/acceptance proof, never read (#1367).
              - '!screenshots/**'
              - '!evidence/**'

  smoke:
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        # PRs run only the required `smoke (ubuntu-latest)` context (docs-only PRs
        # report it with every step skipped); Windows runs on dev pushes and
        # dispatches (tauri#1133). Non-PR events always count as code.
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || ((inputs.native_scope == 'clipboard' || inputs.native_scope == 'transfer') && '["windows-latest"]' || '["ubuntu-latest","windows-latest"]')) }}
    runs-on: ${{ matrix.os }}
    # The Windows debug build alone is ~12 minutes, so a 25-minute job cap left
    # no room for a full suite run: a step bound generous enough to let the
    # specs finish pushed the job past the cap and it was killed as `cancelled`
    # with no artifacts. Cap the job well above build + suite and let the
    # per-step bound below be the thing that actually fails a stuck run.
    # A cold Rust target cache (any Cargo.lock/Cargo.toml/tauri.conf.json
    # change, including every release bump) pays three Windows compiles: the
    # debug app (~19 min), the contract tests (~9 min) and clippy (~8 min),
    # before a ~10 min suite. That came to ~52 min and was cancelled at 50
    # with every spec green (#1447). The compile steps carry their own bounds
    # below, so the job cap only has to hold their sum.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        if: ${{ needs.changes.outputs.code == 'true' }}

      - uses: oven-sh/setup-bun@v2
        if: ${{ needs.changes.outputs.code == 'true' }}
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable
        if: ${{ needs.changes.outputs.code == 'true' }}
        with:
          components: clippy

      # A target directory is reusable only with the same compiler identity.
      # Keep the raw identity in the diagnostic artifact and use its digest in
      # the key so stable-channel updates cannot restore incompatible outputs.
      - name: Record Rust cache identity
        if: ${{ needs.changes.outputs.code == 'true' }}
        id: rust-provenance
        shell: bash
        run: |
          mkdir -p native-contract-diagnostics
          rustc -Vv | tee native-contract-diagnostics/rustc-version.txt
          cargo -V | tee native-contract-diagnostics/cargo-version.txt
          printf 'revision=%s\nrunner_os=%s\nrunner_arch=%s\n' \
            "$GITHUB_SHA" "$RUNNER_OS" "$RUNNER_ARCH" \
            > native-contract-diagnostics/provenance.txt
          toolchain_key="$(rustc -Vv | sha256sum | cut -c1-16)"
          printf 'cache-key=%s\n' "$toolchain_key" >> "$GITHUB_OUTPUT"
          printf 'started-epoch=%s\n' "$(date +%s)" >> "$GITHUB_OUTPUT"

      # Registry/git only — NOT the tauri-driver binary. Caching the binary
      # under a Cargo.lock-derived key let a run where `cargo install` failed
      # save a binary-less cache, which later runs then restored (ENOENT at
      # spawn). tauri-driver is now installed unconditionally below.
      - name: Cache cargo registry
        if: ${{ needs.changes.outputs.code == 'true' }}
        id: cargo-registry-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-registry-

      - name: Restore Rust target cache
        if: ${{ needs.changes.outputs.code == 'true' }}
        id: rust-target-cache
        uses: actions/cache/restore@v6
        with:
          path: src-tauri/target
          key: ${{ runner.os }}-${{ runner.arch }}-target-debug-${{ steps.rust-provenance.outputs.cache-key }}-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml', 'src-tauri/tauri.conf.json') }}

      # nasm: required by turbojpeg-sys (x86 SIMD) since the thumbnail cache
      # moved to turbojpeg. Without it the cargo build fails in cmake.
      # (AVIF/dav1d is a default-off feature, so no libdav1d-dev needed here.)
      # Bounded and cached (#1371): a stalled mirror fails here, in setup.
      - name: Install Linux WebKit driver
        if: ${{ needs.changes.outputs.code == 'true' && (runner.os == 'Linux') }}
        timeout-minutes: 25
        uses: ./.github/actions/tauri-linux-deps
        with:
          packages: >-
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev
            libjavascriptcoregtk-4.1-dev webkit2gtk-driver xvfb openbox x11-utils xclip xdotool dbus-daemon nasm libavif-bin

      - name: Install independent Windows AVIF decoder
        if: ${{ needs.changes.outputs.code == 'true' && (runner.os == 'Windows') }}
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'libavif-1.4.2.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'libavif-1.4.2'
          Invoke-WebRequest 'https://github.com/AOMediaCodec/libavif/releases/download/v1.4.2/windows-artifacts.zip' -OutFile $archive
          $expected = 'cb2d9fea43dcbab1d0707e3b37eb7b08070ad2fb60a2c188c39ec12382c0484a'
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {
            throw 'Official libavif decoder archive checksum mismatch'
          }
          Expand-Archive $archive -DestinationPath $destination -Force
          if (-not (Test-Path (Join-Path $destination 'avifdec.exe'))) {
            throw 'Official libavif decoder is missing'
          }
          $destination >> $env:GITHUB_PATH
          & (Join-Path $destination 'avifdec.exe') --version

      # Linux uses tauri-driver as its WebDriver proxy. Windows attaches
      # msedgedriver directly to the WebView2 CDP endpoint below.
      - name: Install tauri-driver
        if: ${{ needs.changes.outputs.code == 'true' && (runner.os == 'Linux') }}
        shell: bash
        run: |
          cargo install tauri-driver --locked
          ls -l "$HOME/.cargo/bin/tauri-driver"*

      # bun.lock (text format) records optional deps for every platform,
      # so the same lockfile installs correctly on Linux and Windows.
      - name: Install frontend dependencies
        if: ${{ needs.changes.outputs.code == 'true' }}
        shell: bash
        run: bun install --frozen-lockfile

      # This is a qualification contract, but a failure must not hide the
      # independent binary/GUI result or its diagnostics. The final gate below
      # restores its fatal status after those independent checks complete.
      - name: Run native contracts
        if: ${{ needs.changes.outputs.code == 'true' }}
        id: native-contracts
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          set +e
          CARGO_LOG=cargo::core::compiler::fingerprint=info \
            bun run check:e2e:tauri 2>&1 | tee native-contract-diagnostics/native-contracts.log
          status="${PIPESTATUS[0]}"
          set -e
          printf 'command=bun run check:e2e:tauri\nstarted_at=%s\nfinished_at=%s\nexit_status=%s\n' \
            "$started_at" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$status" \
            > native-contract-diagnostics/native-contracts-timing.txt
          exit "$status"

      # Build through the Tauri CLI, not `cargo build`. A bare cargo debug
      # build omits the `tauri/custom-protocol` feature, so the binary serves
      # `build.devUrl` (localhost:1420) and the suite silently needs a Vite dev
      # server running alongside it. `tauri build --debug` passes
      # custom-protocol, so the frontend is embedded and the suite tests the
      # shipped asset path with no dev server to race. (This did NOT fix the
      # Windows hang — #457's session timeout reproduces with the dev server
      # gone — but it removes a real timing dependency and a whole toolchain
      # from the test environment.)
      # VITE_E2E_HOOKS compiles in the `e2e-navigate` / `e2e-reset-view` hooks
      # and the listing/watcher probes the specs drive; the `e2e-hooks` Cargo
      # feature is the matching Rust gate (#884), so a hook build enables both.
      # They used to ride on `import.meta.env.DEV`, which is what tied the
      # suite to a dev-mode binary — and therefore to a dev server — in the
      # first place. Release builds set neither, so the hooks are absent from
      # shipped binaries.
      - name: Build Tauri binary (debug, embedded frontend, no bundle)
        if: ${{ needs.changes.outputs.code == 'true' }}
        id: build-tauri-binary
        # Cold Windows: ~19 min (#1447).
        timeout-minutes: 35
        shell: bash
        env:
          VITE_E2E_HOOKS: "1"
          # The attach feature passes the CDP flag through WebView2's API.
          # Environment overrides are ignored because hosted runners are
          # elevated. Automatic warm priming is disabled during initial attach;
          # explicit child windows inherit the same environment arguments.
          VITE_E2E_NO_WARM_PRIME: ${{ runner.os == 'Windows' && '1' || '' }}
        run: |
          set -o pipefail
          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          set +e
          if [[ "$RUNNER_OS" == 'Linux' ]]; then
            # Record and verify the exact embedded binary's revision/hash for
            # DnD acceptance, rather than qualifying an arbitrary cached app.
            CARGO_LOG=cargo::core::compiler::fingerprint=info \
              bun run build:native:qualification 2>&1 | tee native-contract-diagnostics/tauri-build.log
          else
            CARGO_LOG=cargo::core::compiler::fingerprint=info \
              bun run tauri build --debug --no-bundle --features e2e-hooks,e2e-webview2-attach \
              2>&1 | tee native-contract-diagnostics/tauri-build.log
          fi
          status="${PIPESTATUS[0]}"
          set -e
          printf 'command=bun run tauri build --debug --no-bundle\nstarted_at=%s\nfinished_at=%s\nexit_status=%s\n' \
            "$started_at" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$status" \
            > native-contract-diagnostics/tauri-build-timing.txt
          exit "$status"

      # Upload this before the GUI suite so contract/build failures can be
      # diagnosed while the independent native outcome is still running.
      - name: Collect native qualification diagnostics
        if: ${{ always() && needs.changes.outputs.code == 'true' }}
        shell: bash
        run: |
          {
            printf 'cargo_registry_cache_key=%s\n' "${{ runner.os }}-cargo-registry-${{ hashFiles('src-tauri/Cargo.lock') }}"
            printf 'target_cache_key=%s\n' "${{ runner.os }}-${{ runner.arch }}-target-debug-${{ steps.rust-provenance.outputs.cache-key }}-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml', 'src-tauri/tauri.conf.json') }}"
            printf 'cargo_registry_cache_hit=%s\n' '${{ steps.cargo-registry-cache.outputs.cache-hit }}'
            printf 'rust_target_cache_hit=%s\n' '${{ steps.rust-target-cache.outputs.cache-hit }}'
            printf 'contract_outcome=%s\n' '${{ steps.native-contracts.outcome }}'
            printf 'build_outcome=%s\n' '${{ steps.build-tauri-binary.outcome }}'
          } >> native-contract-diagnostics/provenance.txt
          cargo metadata --manifest-path src-tauri/Cargo.toml --no-deps --format-version=1 \
            > native-contract-diagnostics/cargo-metadata.json
          du -sh src-tauri/target > native-contract-diagnostics/target-size.txt || true
          cache_storage_kib=0
          # Registry or Git sources may legitimately be absent on a warm run.
          # Under pipefail, measure only directories that exist so diagnostics
          # never turn a successful qualification into a failed one.
          for cache_path in src-tauri/target "$CARGO_HOME/registry" "$CARGO_HOME/git"; do
            if [ -d "$cache_path" ]; then
              path_kib="$(du -sk "$cache_path" | awk 'NR == 1 { print $1 }')"
              cache_storage_kib="$(( cache_storage_kib + path_kib ))"
            fi
          done
          cache_storage_bytes="$(( cache_storage_kib * 1024 ))"
          printf 'cache_storage_bytes=%s\ncache_transfer_estimate_bytes=%s\n' \
            "$cache_storage_bytes" "$cache_storage_bytes" \
            >> native-contract-diagnostics/provenance.txt
          find src-tauri/target -path '*/.fingerprint/*' -type f -name '*.json' -print \
            | sort > native-contract-diagnostics/cargo-fingerprints.txt || true
          cat > native-contract-diagnostics/comparison-guide.txt <<'EOF'
          Compare two artifacts with the same target_cache_key and runner identity.
          Use provenance.txt cache-hit, cache_storage_bytes, and uncompressed
          cache_transfer_estimate_bytes fields, the two timing files, cache-outcome.txt
          end_to_end_seconds, and Actions cache logs for actual transfer bytes. Retain
          revision and run attempt with the comparison result.
          EOF

      - name: Upload native contract diagnostics
        if: ${{ always() && needs.changes.outputs.code == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: native-contract-diagnostics-${{ matrix.os }}-${{ github.sha }}-${{ github.run_attempt }}
          path: native-contract-diagnostics/
          if-no-files-found: error

      # Linux mocks and Rust cfg checks cannot prove Shell completion or
      # destination preservation. Exercise the actual Windows adapter, including
      # a collision introduced after MoveItem queues the restore.
      - name: Windows native restore and watcher contracts
        if: ${{ needs.changes.outputs.code == 'true' && (runner.os == 'Windows') }}
        # Cold: ~9.5 min, mostly compiling the test harness (#1447).
        timeout-minutes: 20
        shell: bash
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --lib -- --list > "$RUNNER_TEMP/windows-rust-contracts.list"
          contract_status=0
          for filter in files::batch:: files::windows_paths:: files::restore_outcome files::trash_outcome files::trash_inventory:: git::tests::trash_untracked git::tests::directory_scope files::watch_observation:: git_watch::tests::native_observer; do
            # Cargo succeeds with zero matching tests. Fail explicitly when a
            # source/module move leaves one of these acceptance filters stale.
            if ! awk -v filter="$filter" 'index($0, filter) && /: test$/ { found = 1 } END { exit !found }' "$RUNNER_TEMP/windows-rust-contracts.list"; then
              echo "::error::No Rust contracts match $filter"
              contract_status=1
              continue
            fi
            # Preserve failure while collecting all independent contract families.
            cargo test --manifest-path src-tauri/Cargo.toml --lib "$filter" -- --test-threads=1 || contract_status=1
          done
          exit "$contract_status"

      # Test failures remain fatal, but do not hide independent lint/UI results.
      - name: Windows Rust lint
        if: ${{ needs.changes.outputs.code == 'true' && (!cancelled() && runner.os == 'Windows' && steps.build-tauri-binary.outcome == 'success') }}
        # Cold: ~8 min (#1447).
        timeout-minutes: 20
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --features e2e-hooks,e2e-webview2-attach -- -D warnings

      - name: Run smoke suite (Linux, isolated display and window manager)
        if: ${{ needs.changes.outputs.code == 'true' && (runner.os == 'Linux') }}
        # 36 isolated native sessions take ~30s each just to start WebKitGTK
        # on hosted runners. The old 15m cap stopped before the final 10 specs.
        timeout-minutes: 30
        env:
          NATIVE_BUILD_MANIFEST: qualification-results/native-build.json
        # Own the session bus as well as the display and WM; do not inherit
        # hosted-runner desktop services or rely on D-Bus autolaunch.
        run: |
          native_profile=$(mktemp -d "${RUNNER_TEMP}/tauri-native-profile-XXXXXX")
          trap 'rm -rf "$native_profile"' EXIT
          export XDG_CONFIG_HOME="$native_profile/config"
          export XDG_DATA_HOME="$native_profile/data"
          export XDG_CACHE_HOME="$native_profile/cache"
          export XDG_RUNTIME_DIR="$native_profile/runtime"
          mkdir -p "$XDG_CONFIG_HOME" "$XDG_DATA_HOME" "$XDG_CACHE_HOME" "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          # Export the profile before D-Bus starts: activated portal helpers
          # must inherit the same isolation as WebKit and the application.
          env -u WAYLAND_DISPLAY GDK_BACKEND=x11 xvfb-run -a --server-args="-screen 0 2600x1600x24" dbus-run-session -- bash e2e-tauri/with-window-manager.sh bash -e -c '
            bun run test:e2e:tauri:dnd --negative-control
            bun run test:e2e:tauri:dnd --full
          '

      # The runner's EDGEWEBDRIVER matches the Edge *browser*, but tauri apps
      # run on the WebView2 *runtime*, whose version can differ — msedgedriver
      # hard-rejects mismatches. Download the driver matching the runtime.
      - name: Install msedgedriver matching the WebView2 runtime
        id: webview_driver
        if: ${{ needs.changes.outputs.code == 'true' && (!cancelled() && runner.os == 'Windows' && steps.build-tauri-binary.outcome == 'success') }}
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $version = (Get-ItemProperty $key).pv
          Write-Host "WebView2 runtime version: $version"
          Invoke-WebRequest "https://msedgedriver.microsoft.com/$version/edgedriver_win64.zip" -OutFile edgedriver.zip
          Expand-Archive edgedriver.zip -DestinationPath "$env:RUNNER_TEMP\edgedriver"
          "TAURI_NATIVE_DRIVER=$env:RUNNER_TEMP\edgedriver\msedgedriver.exe" >> $env:GITHUB_ENV

      # Keep the WebView2 suite's bound separate from WebKitGTK session costs
      # and leave time for failure evidence before the overall job cap.
      - name: Run smoke suite (Windows)
        if: ${{ needs.changes.outputs.code == 'true' && (!cancelled() && runner.os == 'Windows' && steps.build-tauri-binary.outcome == 'success' && steps.webview_driver.outcome == 'success') }}
        timeout-minutes: 15
        shell: bash
        env:
          VITE_E2E_NO_WARM_PRIME: "1"
          RUST_LOG: debug
          NATIVE_SCOPE: ${{ inputs.native_scope || 'all' }}
          CLIPBOARD_RUNS: ${{ inputs.clipboard_runs || 1 }}
        run: |
          set -euo pipefail
          if [[ "$NATIVE_SCOPE" == 'clipboard' ]]; then
            if [[ ! "$CLIPBOARD_RUNS" =~ ^([1-9]|10)$ ]]; then
              echo "::error::clipboard_runs must be between 1 and 10"
              exit 2
            fi
            failures=0
            for ((i = 1; i <= CLIPBOARD_RUNS; i++)); do
              printf 'Clipboard diagnostic session %s/%s\n' "$i" "$CLIPBOARD_RUNS"
              if bunx wdio run e2e-tauri/wdio.conf.ts --spec e2e-tauri/specs/context-clipboard.spec.ts; then
                printf 'Clipboard diagnostic session %s passed\n' "$i"
              else
                printf 'Clipboard diagnostic session %s failed\n' "$i"
                failures=$((failures + 1))
              fi
            done
            if (( failures > 0 )); then
              echo "::error::$failures clipboard diagnostic session(s) failed"
              exit 1
            fi
          elif [[ "$NATIVE_SCOPE" == 'transfer' ]]; then
            bunx wdio run e2e-tauri/wdio.conf.ts --spec e2e-tauri/specs/window-transfer-lifetime.spec.ts
          elif [[ "$NATIVE_SCOPE" == 'all' ]]; then
            bun run test:e2e:tauri
          else
            echo "::error::Unknown native_scope: $NATIVE_SCOPE"
            exit 2
          fi

      # Tauri writes frontend/native failures outside the checkout. In particular,
      # WebKitWebDriver need not forward the app's stdout to tauri-driver.
      - name: Collect native application logs
        if: ${{ always() && needs.changes.outputs.code == 'true' }}
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import os from 'node:os';
          import path from 'node:path';
          const data = process.platform === 'win32'
            ? process.env.LOCALAPPDATA
            : process.env.XDG_DATA_HOME || path.join(os.homedir(), '.local', 'share');
          if (!data) throw new Error('Native application data directory is unavailable');
          const source = path.join(data, 'io.github.xnmp.tauri-explorer', 'logs');
          if (fs.existsSync(source)) {
            fs.cpSync(source, 'e2e-tauri/logs/application', { recursive: true });
          } else {
            console.log(`No native application logs at ${source}`);
          }
          JS

      # Build outputs are safe to reuse after a GUI failure once both the
      # contracts and embedded binary build have succeeded. Save explicitly so
      # a failed contract/build can never publish an incomplete target cache.
      - name: Save Rust target cache after native outcome
        id: save-rust-target-cache
        if: ${{ needs.changes.outputs.code == 'true' && (always() && steps.native-contracts.outcome == 'success' && steps.build-tauri-binary.outcome == 'success') }}
        uses: actions/cache/save@v6
        with:
          path: src-tauri/target
          key: ${{ runner.os }}-${{ runner.arch }}-target-debug-${{ steps.rust-provenance.outputs.cache-key }}-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml', 'src-tauri/tauri.conf.json') }}

      - name: Record native cache outcome
        if: ${{ always() && needs.changes.outputs.code == 'true' }}
        shell: bash
        run: |
          {
            printf 'cache_save_outcome=%s\n' '${{ steps.save-rust-target-cache.outcome }}'
            printf 'end_to_end_seconds=%s\n' "$(( $(date +%s) - ${{ steps.rust-provenance.outputs.started-epoch }} ))"
            printf 'cache_transfer_cost=see actions/cache restore and save logs\n'
          } > native-contract-diagnostics/cache-outcome.txt

      - name: Upload native cache outcome
        if: ${{ always() && needs.changes.outputs.code == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: native-cache-outcome-${{ matrix.os }}-${{ github.sha }}-${{ github.run_attempt }}
          path: native-contract-diagnostics/
          if-no-files-found: error

      - name: Fail if native contracts failed
        if: ${{ needs.changes.outputs.code == 'true' && (always() && steps.native-contracts.outcome == 'failure') }}
        shell: bash
        run: exit 1

      - name: Upload WDIO logs
        if: ${{ always() && needs.changes.outputs.code == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: wdio-logs-${{ matrix.os }}
          path: |
            logs/
            e2e-tauri/logs/
          if-no-files-found: ignore

      - name: Upload native clipboard image acceptance
        if: ${{ needs.changes.outputs.code == 'true' && (always() && runner.os == 'Windows') }}
        uses: actions/upload-artifact@v7
        with:
          name: clipboard-image-acceptance-windows
          path: screenshots/fix/722-progress-bar-when-copying-images/*-win32.png
          if-no-files-found: ignore

      - name: Upload native PDF acceptance
        if: ${{ always() && needs.changes.outputs.code == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: native-pdf-${{ matrix.os }}
          path: screenshots/fix/728-zooming-in-pdf-in-preview-isnt-centred/*native-windows*.png
          if-no-files-found: ignore
