name: Image crop native codecs

on:
  push:
    branches: [dev]
    paths:
      - "src-tauri/src/image_crop.rs"
      - "src-tauri/src/image_crop/**"
      - "src-tauri/src/image_operation.rs"
      - "src-tauri/src/files/image_crop.rs"
      - "src-tauri/test_support/image_crop*.rs"
      - "src-tauri/test_support/fixtures/*image-crop*"
      - "src-tauri/Cargo.toml"
      - "src-tauri/Cargo.lock"
      - ".github/workflows/image-crop.yml"
  # Not a required check, so it runs after merge (tauri#1133). macOS is
  # nightly/manual only: dev pushes run Linux and Windows.
  schedule:
    - cron: "43 5 * * *"
  workflow_dispatch:

concurrency:
  group: image-crop-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  codecs:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'push' && '["ubuntu-latest","windows-latest"]' || '["ubuntu-latest","windows-latest","macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'schedule' && 'dev' || '' }}
      - uses: dtolnay/rust-toolchain@stable
      # Bounded and cached (#1371): a stalled mirror fails here, in setup.
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 25
        uses: ./.github/actions/tauri-linux-deps
        with:
          packages: libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev nasm
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: image-crop
      - name: Prepare frontend dist for native context
        shell: bash
        run: mkdir -p build
      - name: Verify native codecs and actual filesystem saves
        shell: bash
        run: |
          mkdir -p qualification-results/image-crop
          rustc -Vv > qualification-results/image-crop/rustc.txt
          cargo test --manifest-path src-tauri/Cargo.toml image_crop -- --nocapture 2>&1 | tee qualification-results/image-crop/tests.log
      - name: Verify opt-in durable replacement and retained history
        if: runner.os == 'Linux'
        shell: bash
        run: cargo test --manifest-path src-tauri/Cargo.toml --features durable-recovery files::image_crop -- --nocapture 2>&1 | tee qualification-results/image-crop/durable-tests.log
      - name: Upload codec qualification
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: image-crop-codecs-${{ runner.os }}-${{ runner.arch }}
          path: qualification-results/image-crop/
