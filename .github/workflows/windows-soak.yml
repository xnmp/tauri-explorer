name: Windows bounded native soak

on:
  pull_request:
    branches: [dev, main]
    paths:
      - '.github/workflows/windows-soak.yml'
      - 'scripts/*native*'
      - 'e2e-tauri/**'
  push:
    branches: [dev]
    paths:
      - '.github/workflows/windows-soak.yml'
      - 'scripts/*native*'
      - 'e2e-tauri/**'
  # Merge queue (#1133). head_ref is empty for merge_group, so the concurrency
  # group falls back to the entry's unique gh-readonly-queue/... ref and queue
  # entries never cancel each other or a PR run.
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

concurrency:
  group: windows-soak-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  # merge_group ignores trigger-level paths, so queue runs apply the same
  # list here (keep it in sync). Runs only for merge_group; a failure leaves
  # the output empty, which the gated jobs treat as changed.
  changes:
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.paths.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
      - id: paths
        uses: ./.github/actions/merge-group-paths
        with:
          patterns: |
            .github/workflows/windows-soak.yml
            scripts/*native*
            e2e-tauri/**

  bounded-soak:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'merge_group' || needs.changes.outputs.run != 'false') }}
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: windows-native-soak
          # Queue-ref caches are visible only to their deleted ref.
          save-if: ${{ github.event_name != 'merge_group' }}
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
      # This builder requires a clean source tree and records the actual binary
      # digest, profile, command and commit consumed by the soak runner.
      - name: Build verified qualification binary
        run: bun run build:native:qualification
      - name: Install matching WebView2 driver
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $version = (Get-ItemProperty $key).pv
          $archive = Join-Path $env:RUNNER_TEMP 'soak-edgedriver.zip'
          $driverDir = Join-Path $env:RUNNER_TEMP 'soak-edgedriver'
          Invoke-WebRequest "https://msedgedriver.microsoft.com/$version/edgedriver_win64.zip" -OutFile $archive
          Expand-Archive $archive -DestinationPath $driverDir
          "TAURI_NATIVE_DRIVER=$driverDir\msedgedriver.exe" >> $env:GITHUB_ENV
      - name: Run one complete native soak cycle
        timeout-minutes: 10
        env:
          SOAK_MAX_CYCLES: '1'
          SOAK_DURATION_MS: '600000'
          SOAK_SEED: windows-bounded-809
          SOAK_EXPECTED_DISPLAY_SCALE: '1'
          VITE_E2E_NO_WARM_PRIME: '1'
          RUST_LOG: debug
        run: bun run test:e2e:tauri:soak
      - name: Retain qualification reports and driver evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-native-soak-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            qualification-results/
            e2e-tauri/logs/
            logs/
          if-no-files-found: warn
