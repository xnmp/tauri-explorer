name: CI auto-rerun

# Re-runs the failed jobs of a failed first attempt once, only when every
# failed job stopped at an install or setup step (#1367). The decision is
# scripts/ci-jobs.mjs auto-rerun; it reads job metadata only and never checks
# out or runs the triggering run's code. workflow_run uses this file from the
# default branch (dev), so changes here take effect after they merge.
on:
  workflow_run:
    workflows: [CI, "Tauri binary E2E (smoke)"]
    types: [completed]

# actions: write for the re-run request; contents: read only to check out
# scripts/ from the default branch.
permissions:
  actions: write
  contents: read

jobs:
  rerun:
    # Attempt 1 only: a re-run's own completion (attempt 2) never re-runs.
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts

      - name: Re-run install/setup failures once
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: node scripts/ci-jobs.mjs auto-rerun
