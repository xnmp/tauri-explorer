ShortDescription: A keyboard-first file manager with fuzzy quick-open, ripgrep content search, and a command palette for every action.
Description: |-
  Tauri Explorer brings the editor workflow to the filesystem: fuzzy file open
  with frecency ranking (Ctrl+P), ripgrep-backed content search (Ctrl+Shift+F),
  a command palette for every action, fully rebindable keys, tabs and dual
  panes, a git commit graph, and a UI you can strip down to nothing.
  No telemetry.
