name: Tauri binary E2E (smoke)

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

# Note: macOS is deliberately omitted. Official `tauri-driver` has no
# WKWebView support (tauri-apps/tauri#7068). Re-add when a stable driver
# exists or if macOS regressions justify the CrabNebula subscription.
jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable

      # Registry/git only — NOT the tauri-driver binary. Caching the binary
      # under a Cargo.lock-derived key let a run where `cargo install` failed
      # save a binary-less cache, which later runs then restored (ENOENT at
      # spawn). tauri-driver is now installed unconditionally below.
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-registry-

      - name: Cache Rust target
        uses: actions/cache@v4
        with:
          path: src-tauri/target
          key: ${{ runner.os }}-target-debug-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-target-debug-

      # nasm: required by turbojpeg-sys (x86 SIMD) since the thumbnail cache
      # moved to turbojpeg. Without it the cargo build fails in cmake.
      # (AVIF/dav1d is a default-off feature, so no libdav1d-dev needed here.)
      - name: Install Linux WebKit driver
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev webkit2gtk-driver xvfb nasm

      # Install unconditionally and fail loudly: a missing binary surfaces
      # here, not as an opaque ENOENT when wdio spawns it. Verify it lands.
      - name: Install tauri-driver
        shell: bash
        run: |
          cargo install tauri-driver --locked
          ls -l "$HOME/.cargo/bin/tauri-driver"*

      # bun.lock (text format) records optional deps for every platform,
      # so the same lockfile installs correctly on Linux and Windows.
      - name: Install frontend dependencies
        shell: bash
        run: bun install --frozen-lockfile

      - name: Build frontend
        run: bun run build

      - name: Build Tauri binary (debug, no bundle)
        shell: bash
        run: cargo build --manifest-path src-tauri/Cargo.toml

      # Debug-profile tauri binaries embed build.devUrl (localhost:1420)
      # instead of the bundled frontend — the webview is blank unless the
      # dev server is up.
      - name: Start frontend dev server (Linux)
        if: runner.os == 'Linux'
        run: |
          nohup bun run dev > /tmp/vite.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:1420 > /dev/null && exit 0
            sleep 1
          done
          echo "dev server never came up" >&2
          cat /tmp/vite.log >&2
          exit 1

      - name: Start frontend dev server (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Start-Process bun -ArgumentList 'run','dev' -WindowStyle Hidden
          foreach ($i in 1..60) {
            try {
              Invoke-WebRequest -UseBasicParsing http://localhost:1420 | Out-Null
              exit 0
            } catch { Start-Sleep -Seconds 1 }
          }
          Write-Error "dev server never came up"

      - name: Run smoke suite (Linux, under Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a --server-args="-screen 0 1280x1024x24" bun run test:e2e:tauri

      # The runner's EDGEWEBDRIVER matches the Edge *browser*, but tauri apps
      # run on the WebView2 *runtime*, whose version can differ — msedgedriver
      # hard-rejects mismatches. Download the driver matching the runtime.
      - name: Install msedgedriver matching the WebView2 runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $version = (Get-ItemProperty $key).pv
          Write-Host "WebView2 runtime version: $version"
          Invoke-WebRequest "https://msedgedriver.microsoft.com/$version/edgedriver_win64.zip" -OutFile edgedriver.zip
          Expand-Archive edgedriver.zip -DestinationPath "$env:RUNNER_TEMP\edgedriver"
          "TAURI_NATIVE_DRIVER=$env:RUNNER_TEMP\edgedriver\msedgedriver.exe" >> $env:GITHUB_ENV

      - name: Run smoke suite (Windows)
        if: runner.os == 'Windows'
        run: bun run test:e2e:tauri

      - name: Upload WDIO logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: wdio-logs-${{ matrix.os }}
          path: |
            logs/
            e2e-tauri/logs/
          if-no-files-found: ignore
