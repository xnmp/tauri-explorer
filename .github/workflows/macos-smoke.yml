# macOS launch qualification (#192, #688): the automated real-process signal
# available without a WKWebView WebDriver. Builds embedded assets and records
# bounded cold-start and hidden warm-activation p50/p95 from native log probes.
name: macOS Smoke

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  launch-smoke:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: macos-smoke-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build frontend
        run: bun run build

      - name: Build app (embedded assets)
        # custom-protocol is what makes the binary serve the bundled dist
        # instead of dialing the dev server on localhost:1420.
        run: cargo build --features tauri/custom-protocol
        working-directory: src-tauri

      # WARM_MEASURE uses the app's real hidden WKWebView activation probe. The
      # qualifier requires both native cold and warm markers on every sample,
      # checks that the process survives setup, and records p50/p95 rather than
      # inferring launch timing from a browser mock or a single process check.
      - name: Measure real macOS cold and warm startup
        env:
          MAC_STARTUP_SAMPLES: "30"
          MAC_STARTUP_TIMEOUT_MS: "30000"
        run: bun run test:qualify:macos-startup

      - name: Upload macOS startup qualification
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-startup-qualification
          path: qualification-results/macos-startup/
          if-no-files-found: error
