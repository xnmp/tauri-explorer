name: CI

on:
  # Not main: a dev->main PR carries code whose dev push already ran this
  # whole workflow, and release.yml refuses a release whose tree lacks that
  # passing dev run (scripts/release-ci-gate.mjs, #1367). Main pushes still run.
  pull_request:
    branches: [dev]
  push:
    branches: [dev, main]
  # Nightly full run without the test-result cache, on the default branch
  # (dev): catches environment drift and flakes that cached replays hide.
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      test_cache:
        description: Serve unchanged passing test targets from the test-result cache (#1176)
        type: boolean
        default: true

# GitHub binds result artifacts to their producing run. Restore accepts only
# successful CI pushes to protected dev, never PR artifacts or shared caches.
# PR credentials cannot upload into those dev runs, even if PR code enables
# TEST_CACHE_WRITE. The flag below is an optimization, not authorization.
permissions:
  contents: read
  actions: read

env:
  # bun inside the Playwright container (the host jobs use setup-bun). Exact
  # version, released at least two weeks before it is pinned.
  CONTAINER_BUN_VERSION: "1.4.3"
  TEST_CACHE_WRITE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' }}
  TEST_CACHE_READ: ${{ vars.TEST_CACHE != 'off' && github.event_name != 'schedule' && !(github.event_name == 'workflow_dispatch' && !inputs.test_cache) }}

# Only PRs share a group. Unique non-PR groups preserve every dev run,
# including pending runs that GitHub would otherwise replace.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Docs-only PRs skip the heavy suites. Required status contexts must still
  # report, and a skipped matrix job never expands its contexts, so required
  # jobs keep running and gate their steps on this output instead. Anything not
  # matching the docs patterns, and every non-PR event, counts as code.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    # Per-tier test selection (#1175). Every selector reads only the git diff,
    # never PR text, labels or author claims, and any doubt runs that tier in
    # full: a failed selector, an unknown file type, an unusual path, or more
    # than TEST_SELECTION_MAX_FILES changed files.
    env:
      TEST_SELECTION_MAX_FILES: 50
    outputs:
      code: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.code }}
      # Browser specs a PR can affect (scripts/e2e-affected.mjs, #1131): "ALL",
      # "NONE" or space-separated e2e/ spec paths. Every non-PR event runs ALL,
      # so dev keeps full Chromium and WebKit coverage after each merge.
      e2e: ${{ github.event_name == 'pull_request' && steps.select.outputs.e2e || 'ALL' }}
      e2e-reason: ${{ github.event_name == 'pull_request' && steps.select.outputs.e2e-reason || format('{0} event runs every test', github.event_name) }}
      # WebKit specs (e2e-affected.mjs --webkit, #1367): narrower than e2e only
      # when no WKWebView-sensitive area changed; ALL outside PRs.
      webkit: ${{ github.event_name == 'pull_request' && steps.select.outputs.webkit || 'ALL' }}
      webkit-reason: ${{ github.event_name == 'pull_request' && steps.select.outputs.webkit-reason || format('{0} event runs every test', github.event_name) }}
      # Specs to run with ALL_VIEW_MODES=1 (e2e-affected.mjs --view-modes);
      # ALL means every spec that iterates the view modes.
      view-modes: ${{ github.event_name == 'pull_request' && steps.select.outputs.view-modes || 'ALL' }}
      view-modes-reason: ${{ github.event_name == 'pull_request' && steps.select.outputs.view-modes-reason || format('{0} event runs every test', github.event_name) }}
      # Vitest inputs for `vitest related` (scripts/unit-affected.mjs): "ALL",
      # "NONE" or space-separated repo paths.
      unit: ${{ github.event_name == 'pull_request' && steps.select.outputs.unit || 'ALL' }}
      unit-reason: ${{ github.event_name == 'pull_request' && steps.select.outputs.unit-reason || format('{0} event runs every test', github.event_name) }}
      # Cargo packages for `cargo test -p` (scripts/rust-affected.mjs): "ALL",
      # "NONE" or space-separated workspace member names.
      rust: ${{ github.event_name == 'pull_request' && steps.select.outputs.rust || 'ALL' }}
      rust-reason: ${{ github.event_name == 'pull_request' && steps.select.outputs.rust-reason || format('{0} event runs every test', github.event_name) }}
    steps:
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          # A file is code unless it matches a docs exclusion.
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!docs/**'
              # Root-level Markdown only: Markdown under e2e/, src/, tests/ and
              # elsewhere can be a fixture or a text contract, so it stays code.
              - '!*.md'
              - '!output/**'
              # Written by browser specs as issue/acceptance proof; no test,
              # build or script reads them (#1367).
              - '!screenshots/**'
              - '!evidence/**'

      # The PR merge commit's first parent is the base tip, so HEAD^1...HEAD is
      # exactly the PR's change. Any selector failure falls back to ALL.
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2

      # Each selector prints {mode, reason, items} JSON; a selector or parse
      # failure selects the full tier. rust-affected runs `cargo metadata`
      # (the runner image's cargo) only when a change reaches Rust.
      - id: select
        if: github.event_name == 'pull_request'
        run: |
          select_tier() {
            local tier=$1 json mode
            shift
            if ! json=$(node "$@" --json --max-files "$TEST_SELECTION_MAX_FILES" HEAD^1 HEAD) ||
               ! mode=$(jq -er '.mode' <<< "$json"); then
              json='{"mode":"all","reason":"selection failed","items":[]}'
              mode=all
            fi
            case "$mode" in
              all) selection=ALL ;;
              none) selection=NONE ;;
              *) selection=$(jq -r '.items | join(" ")' <<< "$json") ;;
            esac
            reason=$(jq -r '.reason' <<< "$json")
            echo "$tier=${selection:-NONE}" >> "$GITHUB_OUTPUT"
            echo "$tier-reason=$reason" >> "$GITHUB_OUTPUT"
            echo "$tier: ${selection:-NONE} ($reason)"
            echo "- **$tier**: \`${selection:-NONE}\` — $reason" >> "$GITHUB_STEP_SUMMARY"
          }
          echo "### Test selection (limit $TEST_SELECTION_MAX_FILES changed files)" >> "$GITHUB_STEP_SUMMARY"
          select_tier e2e scripts/e2e-affected.mjs --strict
          select_tier webkit scripts/e2e-affected.mjs --webkit
          select_tier view-modes scripts/e2e-affected.mjs --view-modes
          select_tier unit scripts/unit-affected.mjs
          select_tier rust scripts/rust-affected.mjs

  # Code maps are only useful while they are accurate: an agent that trusts a map
  # naming a moved file searches worse than one with no map at all. Two guards —
  # references (every file a map names exists) and coverage (every source file is
  # in map-folder.md, so new files can't go unmapped).
  code-maps:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Validate code maps (references + coverage)
        run: python3 docs/code-map/validate.py --coverage

  frontend-checks:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Restore computes the same input hash as execution.
    env:
      UNIT_SELECTION: ${{ needs.changes.outputs.unit }}
      UNIT_REASON: ${{ needs.changes.outputs.unit-reason }}
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Root type checks and relay tests import website/api/report.js, whose
      # Blob client belongs to the independently deployed website package.
      - name: Install website dependencies
        run: bun install --cwd website --frozen-lockfile

      - name: Type check
        run: bun run check

      - name: Architecture boundaries
        run: bun run lint:arch

      - name: Startup bundle budget
        run: bun run check:bundle

      - name: Test-result cache key
        id: test-cache-key
        run: node scripts/test-cache.mjs key --target "unit"

      - name: Restore test-result cache
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/test-cache.mjs restore --target "unit"

      # PRs run only the tests whose import graph reaches a changed file, or
      # that read it as text (scripts/unit-affected.mjs); other events run all.
      # scripts/ci-test-unit.sh runs them, or the cache replays an unchanged
      # passing result.
      - name: Unit tests
        id: test-cache-run
        run: |
          case "$UNIT_SELECTION" in
            ALL)
              echo "Unit tests: full suite ($UNIT_REASON)" ;;
            NONE)
              echo "Unit tests: none selected ($UNIT_REASON)"
              exit 0 ;;
            *)
              echo "Unit tests: selected subset ($UNIT_REASON): tests related to $UNIT_SELECTION" ;;
          esac
          node scripts/test-cache.mjs run --task ci:unit --target "unit"

      - name: Pack test-result cache
        id: test-cache-pack
        if: success() && env.TEST_CACHE_WRITE == 'true' && steps.test-cache-run.outputs.stored == 'true'
        run: node scripts/test-cache.mjs pack --target "unit"

      - name: Save test-result cache
        if: success() && env.TEST_CACHE_WRITE == 'true' && steps.test-cache-run.outputs.stored == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: trusted-${{ steps.test-cache-key.outputs.key }}
          path: ${{ steps.test-cache-pack.outputs.archive }}
          retention-days: 30
          if-no-files-found: error

      - name: Upload test-result cache record
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-cache-unit
          path: ${{ runner.temp }}/test-cache-report/
          if-no-files-found: ignore

  # Keep one browser worker per runner; split the growing suite across runners
  # so contention-sensitive tests retain their existing execution conditions.
  # Shards are whole spec files balanced by recorded CI duration
  # (scripts/e2e-shards.mjs, #1123): Playwright's count-based --shard left one
  # shard ~1.8x longer than another, and the slowest shard sets wall time.
  # Chromium runs every spec for any frontend change, so it sets PR wall time:
  # four ~14-minute shards (#1367; the suite grew to ~56 recorded minutes).
  # Skipped when the PR selects no browser spec; the frontend gate accepts that.
  chromium:
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.e2e != 'NONE'
    runs-on: ubuntu-latest
    # The Playwright image carries the browsers and every system library they
    # need, so no shard downloads apt packages (#1367: --with-deps fetched
    # 117 MB from a mirror that was sometimes ~54 kB/s). Its tag must equal
    # bun.lock's @playwright/test version (tests/ci-playwright-container.test.ts).
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble@sha256:9bd26ad900bb5e0f4dee75839e957a89ae89c2b7ab1e76050e559790e946b948
      # Chromium needs more shared memory than Docker's 64 MB default.
      options: --ipc=host
    # Steps use bash features (here-strings); do not fall back to sh.
    defaults:
      run:
        shell: bash
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # Job-wide so the cache probe and the run hash the same environment. The
    # container, not the runner image, is this job's environment: name it in
    # the test-result cache's platform identity.
    env:
      E2E_ENGINE: chromium
      ImageOS: playwright_noble
      ImageVersion: "1.60.0_9bd26ad900bb5e0f4dee75839e957a89ae89c2b7ab1e76050e559790e946b948"
      TEST_CACHE_NORMALIZE_VERSION: "1"
      # Below the step cap, so a stall reports interrupted tests (#1367).
      E2E_GLOBAL_TIMEOUT_MINUTES: "24"
    steps:
      - uses: actions/checkout@v7

      # The container runs as root over a runner-owned checkout; Turborepo
      # lists inputs through git, which refuses an unowned repository.
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # Plans only the specs this PR can affect (all of them outside PRs). A
      # shard left with nothing to run skips the remaining steps and passes.
      - name: Plan duration-balanced shard
        id: plan
        env:
          E2E_SELECTION: ${{ needs.changes.outputs.e2e }}
          E2E_REASON: ${{ needs.changes.outputs.e2e-reason }}
        run: |
          if [ "$E2E_SELECTION" = ALL ]; then
            echo "chromium E2E: full suite ($E2E_REASON)"
          else
            echo "chromium E2E: selected subset ($E2E_REASON)"
          fi
          tr ' ' '\n' <<< "$E2E_SELECTION" > "$RUNNER_TEMP/e2e-selection.txt"
          node scripts/e2e-shards.mjs plan --engine chromium --shard ${{ matrix.shard }}/${{ strategy.job-total }} --only "$RUNNER_TEMP/e2e-selection.txt" --out "$RUNNER_TEMP/e2e-shard.txt"
          # Report records live outside the checkout; actions read this path
          # inside the container, where runner.temp would name the host's.
          echo "TEST_CACHE_REPORT=$RUNNER_TEMP/test-cache-report" >> "$GITHUB_ENV"
          if [ -s "$RUNNER_TEMP/e2e-shard.txt" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            # The shard's spec list is hashed into its test-result cache key.
            printf 'E2E_SHARD_SPECS<<E2E_SHARD_SPECS_EOF\n%s\nE2E_SHARD_SPECS_EOF\n' "$(cat "$RUNNER_TEMP/e2e-shard.txt")" >> "$GITHUB_ENV"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No affected chromium specs in this shard." >> "$GITHUB_STEP_SUMMARY"
          fi

      # setup-bun extracts with unzip, which the image lacks. The platform
      # package is bun's prebuilt binary; --ignore-scripts runs no install
      # script. CONTAINER_BUN_VERSION (workflow env) is the single pin.
      - name: Install bun
        if: steps.plan.outputs.run == 'true'
        run: |
          npm install --global --ignore-scripts "@oven/bun-linux-x64@${CONTAINER_BUN_VERSION}"
          ln -sf "$(npm root --global)/@oven/bun-linux-x64/bin/bun" /usr/local/bin/bun
          ln -sf /usr/local/bin/bun /usr/local/bin/bunx
          test "$(bun --version)" = "$CONTAINER_BUN_VERSION"

      - name: Install dependencies
        if: steps.plan.outputs.run == 'true'
        run: bun install --frozen-lockfile

      - name: Test-result cache key
        id: test-cache-key
        if: steps.plan.outputs.run == 'true'
        run: node scripts/test-cache.mjs key --target "chromium-${{ matrix.shard }}"

      - name: Restore test-result cache
        if: steps.plan.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/test-cache.mjs restore --target "chromium-${{ matrix.shard }}"

      - name: Probe test-result cache
        id: test-cache-probe
        if: steps.plan.outputs.run == 'true'
        run: node scripts/test-cache.mjs probe --task ci:e2e --target "chromium-${{ matrix.shard }}"

      # scripts/ci-test-e2e.sh verifies the shard selection and runs it, or the
      # cache replays an unchanged passing result. Playwright's global timeout
      # (E2E_GLOBAL_TIMEOUT_MINUTES) fires first; this cap is the backstop.
      - name: E2E tests
        id: test-cache-run
        timeout-minutes: 26
        env:
          E2E_SELECTION: ${{ needs.changes.outputs.e2e }}
          E2E_REASON: ${{ needs.changes.outputs.e2e-reason }}
        run: |
          mode=$([ "$E2E_SELECTION" = ALL ] && echo "full suite" || echo "selected subset")
          if [ "${{ steps.plan.outputs.run }}" != true ]; then
            echo "chromium E2E: nothing to run in this shard; $mode ($E2E_REASON)"
            exit 0
          fi
          echo "chromium E2E: $mode ($E2E_REASON), shard of $(wc -l < "$RUNNER_TEMP/e2e-shard.txt") spec file(s)"
          node scripts/test-cache.mjs run --task ci:e2e --target "chromium-${{ matrix.shard }}"

      - name: Pack test-result cache
        id: test-cache-pack
        if: success() && env.TEST_CACHE_WRITE == 'true' && steps.test-cache-run.outputs.stored == 'true'
        run: node scripts/test-cache.mjs pack --target "chromium-${{ matrix.shard }}"

      - name: Save test-result cache
        if: success() && env.TEST_CACHE_WRITE == 'true' && steps.test-cache-run.outputs.stored == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: trusted-${{ steps.test-cache-key.outputs.key }}
          path: ${{ steps.test-cache-pack.outputs.archive }}
          retention-days: 30
          if-no-files-found: error

      - name: Upload test-result cache record
        if: always() && env.TEST_CACHE_REPORT != ''
        uses: actions/upload-artifact@v7
        with:
          name: test-cache-chromium-${{ matrix.shard }}
          path: ${{ env.TEST_CACHE_REPORT }}/
          if-no-files-found: ignore

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-chromium-${{ matrix.shard }}
          path: playwright-report/
          if-no-files-found: ignore

  # List and Tiles coverage (#1367): the specs that iterate VIEW_MODES run
  # with ALL_VIEW_MODES=1 on Chromium. Every dev push, nightly run and dispatch
  # runs all of them; a PR runs those reached through a changed view-mode
  # component or spec (scripts/e2e-affected.mjs --view-modes), or none.
  chromium-view-modes:
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.view-modes != 'NONE'
    runs-on: ubuntu-latest
    # The Playwright image carries the browsers and every system library they
    # need, so no shard downloads apt packages (#1367: --with-deps fetched
    # 117 MB from a mirror that was sometimes ~54 kB/s). Its tag must equal
    # bun.lock's @playwright/test version (tests/ci-playwright-container.test.ts).
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble@sha256:9bd26ad900bb5e0f4dee75839e957a89ae89c2b7ab1e76050e559790e946b948
      # Chromium needs more shared memory than Docker's 64 MB default.
      options: --ipc=host
    # Steps use bash features (here-strings); do not fall back to sh.
    defaults:
      run:
        shell: bash
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    # Job-wide so the cache probe and the run hash the same environment. The
    # container, not the runner image, is this job's environment: name it in
    # the test-result cache's platform identity.
    env:
      E2E_ENGINE: chromium
      ALL_VIEW_MODES: "1"
      ImageOS: playwright_noble
      ImageVersion: "1.60.0_9bd26ad900bb5e0f4dee75839e957a89ae89c2b7ab1e76050e559790e946b948"
      TEST_CACHE_NORMALIZE_VERSION: "1"
      # Below the step cap, so a stall reports interrupted tests (#1367).
      E2E_GLOBAL_TIMEOUT_MINUTES: "24"
    steps:
      - uses: actions/checkout@v7

      # The container runs as root over a runner-owned checkout; Turborepo
      # lists inputs through git, which refuses an unowned repository.
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # Plans only the specs this PR can affect (all of them outside PRs). A
      # shard left with nothing to run skips the remaining steps and passes.
      - name: Plan duration-balanced shard
        id: plan
        env:
          E2E_SELECTION: ${{ needs.changes.outputs.view-modes }}
          E2E_REASON: ${{ needs.changes.outputs.view-modes-reason }}
        run: |
          if [ "$E2E_SELECTION" = ALL ]; then
            echo "chromium ALL_VIEW_MODES E2E: full suite ($E2E_REASON)"
          else
            echo "chromium ALL_VIEW_MODES E2E: selected subset ($E2E_REASON)"
          fi
          # ALL means every spec that iterates the view modes; the others run
          # identically with or without ALL_VIEW_MODES.
          if [ "$E2E_SELECTION" = ALL ]; then
            node scripts/e2e-affected.mjs --list-view-mode-specs > "$RUNNER_TEMP/e2e-selection.txt"
          else
            tr ' ' '\n' <<< "$E2E_SELECTION" > "$RUNNER_TEMP/e2e-selection.txt"
          fi
          node scripts/e2e-shards.mjs plan --engine chromium --shard ${{ matrix.shard }}/${{ strategy.job-total }} --only "$RUNNER_TEMP/e2e-selection.txt" --out "$RUNNER_TEMP/e2e-shard.txt"
          # Report records live outside the checkout; actions read this path
          # inside the container, where runner.temp would name the host's.
          echo "TEST_CACHE_REPORT=$RUNNER_TEMP/test-cache-report" >> "$GITHUB_ENV"
          if [ -s "$RUNNER_TEMP/e2e-shard.txt" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            # The shard's spec list is hashed into its test-result cache key.
            printf 'E2E_SHARD_SPECS<<E2E_SHARD_SPECS_EOF\n%s\nE2E_SHARD_SPECS_EOF\n' "$(cat "$RUNNER_TEMP/e2e-shard.txt")" >> "$GITHUB_ENV"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No affected chromium specs in this shard." >> "$GITHUB_STEP_SUMMARY"
          fi

      # setup-bun extracts with unzip, which the image lacks. The platform
      # package is bun's prebuilt binary; --ignore-scripts runs no install
      # script. CONTAINER_BUN_VERSION (workflow env) is the single pin.
      - name: Install bun
        if: steps.plan.outputs.run == 'true'
        run: |
          npm install --global --ignore-scripts "@oven/bun-linux-x64@${CONTAINER_BUN_VERSION}"
          ln -sf "$(npm root --global)/@oven/bun-linux-x64/bin/bun" /usr/local/bin/bun
          ln -sf /usr/local/bin/bun /usr/local/bin/bunx
          test "$(bun --version)" = "$CONTAINER_BUN_VERSION"

      - name: Install dependencies
        if: steps.plan.outputs.run == 'true'
        run: bun install --frozen-lockfile

      - name: Test-result cache key
        id: test-cache-key
        if: steps.plan.outputs.run == 'true'
        run: node scripts/test-cache.mjs key --target "chromium-view-modes-${{ matrix.shard }}"

      - name: Restore test-result cache
        if: steps.plan.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/test-cache.mjs restore --target "chromium-view-modes-${{ matrix.shard }}"

      - name: Probe test-result cache
        id: test-cache-probe
        if: steps.plan.outputs.run == 'true'
        run: node scripts/test-cache.mjs probe --task ci:e2e --target "chromium-view-modes-${{ matrix.shard }}"

      # scripts/ci-test-e2e.sh verifies the shard selection and runs it, or the
      # cache replays an unchanged passing result. Playwright's global timeout
      # (E2E_GLOBAL_TIMEOUT_MINUTES) fires first; this cap is the backstop.
      - name: E2E tests (all view modes)
        id: test-cache-run
        timeout-minutes: 26
        env:
          E2E_SELECTION: ${{ needs.changes.outputs.view-modes }}
          E2E_REASON: ${{ needs.changes.outputs.view-modes-reason }}
        run: |
          mode=$([ "$E2E_SELECTION" = ALL ] && echo "full suite" || echo "selected subset")
          if [ "${{ steps.plan.outputs.run }}" != true ]; then
            echo "chromium ALL_VIEW_MODES E2E: nothing to run in this shard; $mode ($E2E_REASON)"
            exit 0
          fi
          echo "chromium ALL_VIEW_MODES E2E: $mode ($E2E_REASON), shard of $(wc -l < "$RUNNER_TEMP/e2e-shard.txt") spec file(s)"
          node scripts/test-cache.mjs run --task ci:e2e --target "chromium-view-modes-${{ matrix.shard }}"

      - name: Pack test-result cache
        id: test-cache-pack
        if: success() && env.TEST_CACHE_WRITE == 'true' && steps.test-cache-run.outputs.stored == 'true'
        run: node scripts/test-cache.mjs pack --target "chromium-view-modes-${{ matrix.shard }}"

      - name: Save test-result cache
        if: success() && env.TEST_CACHE_WRITE == 'true' && steps.test-cache-run.outputs.stored == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: trusted-${{ steps.test-cache-key.outputs.key }}
          path: ${{ steps.test-cache-pack.outputs.archive }}
          retention-days: 30
          if-no-files-found: error

      - name: Upload test-result cache record
        if: always() && env.TEST_CACHE_REPORT != ''
        uses: actions/upload-artifact@v7
        with:
          name: test-cache-chromium-view-modes-${{ matrix.shard }}
          path: ${{ env.TEST_CACHE_REPORT }}/
          if-no-files-found: ignore

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-chromium-view-modes-${{ matrix.shard }}
          path: playwright-report/
          if-no-files-found: ignore

  # Preserve the protected-branch check name and require every Chromium shard.
  frontend:
    if: always()
    needs: [changes, frontend-checks, chromium, chromium-view-modes]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Diagnostics only: name each upstream shard's result and the step a
      # failed or cancelled one stopped at. The check below decides.
      - uses: actions/checkout@v7
        continue-on-error: true
        with:
          sparse-checkout: scripts
      - name: Report upstream job results
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-jobs.mjs report frontend-checks chromium chromium-view-modes

      # Upstream jobs are skipped only on a docs-only PR, or a browser job when
      # its selection is NONE; otherwise every one must succeed, so a failed,
      # cancelled or skipped shard still fails this check.
      - name: Require frontend validation and browser outcomes
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          E2E: ${{ needs.changes.outputs.e2e }}
          VIEW_MODES: ${{ needs.changes.outputs.view-modes }}
          CHECKS_RESULT: ${{ needs.frontend-checks.result }}
          CHROMIUM_RESULT: ${{ needs.chromium.result }}
          VIEW_MODES_RESULT: ${{ needs.chromium-view-modes.result }}
        run: |
          ok=true
          expect() {
            if [ "$2" = "$3" ]; then
              echo "$1: $2"
            else
              echo "::error title=$1 $2::$1 is $2, expected $3"
              ok=false
            fi
          }
          # A job is skipped only when its selection is NONE (or on a docs-only PR).
          selected() { [ "$1" = NONE ] && echo skipped || echo success; }
          expect changes "$CHANGES_RESULT" success
          if [ "$CODE" = true ]; then
            expect frontend-checks "$CHECKS_RESULT" success
            expect chromium "$CHROMIUM_RESULT" "$(selected "$E2E")"
            expect chromium-view-modes "$VIEW_MODES_RESULT" "$(selected "$VIEW_MODES")"
          else
            expect frontend-checks "$CHECKS_RESULT" skipped
            expect chromium "$CHROMIUM_RESULT" skipped
            expect chromium-view-modes "$VIEW_MODES_RESULT" skipped
          fi
          $ok

  # WebKit ≈ WKWebView — the closest automated proxy for the macOS webview
  # (no WKWebView WebDriver exists). Catches Safari-family CSS/JS breakage.
  # Keep one worker on each runner and the per-runner bound (#932); five
  # duration-balanced shards (#1123). Dev pushes, nightly runs and dispatches
  # run every spec; a PR runs scripts/e2e-affected.mjs --webkit (#1367): the
  # cluster-mapped and curated engine-specific specs, or every spec for a
  # WKWebView-sensitive change. Skipped when that selects nothing.
  webkit-tests:
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.webkit != 'NONE'
    runs-on: ubuntu-latest
    # The Playwright image carries the browsers and every system library they
    # need, so no shard downloads apt packages (#1367: --with-deps fetched
    # 117 MB from a mirror that was sometimes ~54 kB/s). Its tag must equal
    # bun.lock's @playwright/test version (tests/ci-playwright-container.test.ts).
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble@sha256:9bd26ad900bb5e0f4dee75839e957a89ae89c2b7ab1e76050e559790e946b948
      # Chromium needs more shared memory than Docker's 64 MB default.
      options: --ipc=host
    # Steps use bash features (here-strings); do not fall back to sh.
    defaults:
      run:
        shell: bash
    # Shards are planned at ~24 min, but container runs of the same plan took
    # 22-30 min. Headroom rather than a sixth shard: browser, Rust and smoke
    # jobs already queue for runners on a full PR run, and each extra shard
    # adds its own setup (#1367).
    timeout-minutes: 46
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    # Job-wide so the cache probe and the run hash the same environment. The
    # container, not the runner image, is this job's environment: name it in
    # the test-result cache's platform identity.
    env:
      E2E_ENGINE: webkit
      WEBKIT: "1"
      PW_VIDEO_HEADED: "1"
      ImageOS: playwright_noble
      ImageVersion: "1.60.0_9bd26ad900bb5e0f4dee75839e957a89ae89c2b7ab1e76050e559790e946b948"
      TEST_CACHE_NORMALIZE_VERSION: "1"
      # Below the step cap, so a stall reports interrupted tests (#1367).
      E2E_GLOBAL_TIMEOUT_MINUTES: "40"
    steps:
      - uses: actions/checkout@v7

      # The container runs as root over a runner-owned checkout; Turborepo
      # lists inputs through git, which refuses an unowned repository.
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # Plans only the specs this PR can affect (all of them outside PRs). A
      # shard left with nothing to run skips the remaining steps and passes.
      - name: Plan duration-balanced shard
        id: plan
        env:
          E2E_SELECTION: ${{ needs.changes.outputs.webkit }}
          E2E_REASON: ${{ needs.changes.outputs.webkit-reason }}
        run: |
          if [ "$E2E_SELECTION" = ALL ]; then
            echo "WebKit E2E: full suite ($E2E_REASON)"
          else
            echo "WebKit E2E: selected subset ($E2E_REASON)"
          fi
          tr ' ' '\n' <<< "$E2E_SELECTION" > "$RUNNER_TEMP/e2e-selection.txt"
          node scripts/e2e-shards.mjs plan --engine webkit --shard ${{ matrix.shard }}/${{ strategy.job-total }} --only "$RUNNER_TEMP/e2e-selection.txt" --out "$RUNNER_TEMP/e2e-shard.txt"
          # Report records live outside the checkout; actions read this path
          # inside the container, where runner.temp would name the host's.
          echo "TEST_CACHE_REPORT=$RUNNER_TEMP/test-cache-report" >> "$GITHUB_ENV"
          if [ -s "$RUNNER_TEMP/e2e-shard.txt" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            # The shard's spec list is hashed into its test-result cache key.
            printf 'E2E_SHARD_SPECS<<E2E_SHARD_SPECS_EOF\n%s\nE2E_SHARD_SPECS_EOF\n' "$(cat "$RUNNER_TEMP/e2e-shard.txt")" >> "$GITHUB_ENV"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No affected webkit specs in this shard." >> "$GITHUB_STEP_SUMMARY"
          fi

      # setup-bun extracts with unzip, which the image lacks. The platform
      # package is bun's prebuilt binary; --ignore-scripts runs no install
      # script. CONTAINER_BUN_VERSION (workflow env) is the single pin.
      - name: Install bun
        if: steps.plan.outputs.run == 'true'
        run: |
          npm install --global --ignore-scripts "@oven/bun-linux-x64@${CONTAINER_BUN_VERSION}"
          ln -sf "$(npm root --global)/@oven/bun-linux-x64/bin/bun" /usr/local/bin/bun
          ln -sf /usr/local/bin/bun /usr/local/bin/bunx
          test "$(bun --version)" = "$CONTAINER_BUN_VERSION"

      - name: Install dependencies
        if: steps.plan.outputs.run == 'true'
        run: bun install --frozen-lockfile

      - name: Test-result cache key
        id: test-cache-key
        if: steps.plan.outputs.run == 'true'
        run: node scripts/test-cache.mjs key --target "webkit-${{ matrix.shard }}"

      - name: Restore test-result cache
        if: steps.plan.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/test-cache.mjs restore --target "webkit-${{ matrix.shard }}"

      - name: Probe test-result cache
        id: test-cache-probe
        if: steps.plan.outputs.run == 'true'
        run: node scripts/test-cache.mjs probe --task ci:e2e --target "webkit-${{ matrix.shard }}"

      # scripts/ci-test-e2e.sh verifies the shard selection and runs it, or the
      # cache replays an unchanged passing result. Playwright's global timeout
      # (E2E_GLOBAL_TIMEOUT_MINUTES) fires first; this cap is the backstop.
      - name: E2E tests (WebKit)
        id: test-cache-run
        timeout-minutes: 43
        env:
          E2E_SELECTION: ${{ needs.changes.outputs.webkit }}
          E2E_REASON: ${{ needs.changes.outputs.webkit-reason }}
        run: |
          mode=$([ "$E2E_SELECTION" = ALL ] && echo "full suite" || echo "selected subset")
          if [ "${{ steps.plan.outputs.run }}" != true ]; then
            echo "WebKit E2E: nothing to run in this shard; $mode ($E2E_REASON)"
            exit 0
          fi
          echo "WebKit E2E: $mode ($E2E_REASON), shard of $(wc -l < "$RUNNER_TEMP/e2e-shard.txt") spec file(s)"
          node scripts/test-cache.mjs run --task ci:e2e --target "webkit-${{ matrix.shard }}"

      - name: Pack test-result cache
        id: test-cache-pack
        if: success() && env.TEST_CACHE_WRITE == 'true' && steps.test-cache-run.outputs.stored == 'true'
        run: node scripts/test-cache.mjs pack --target "webkit-${{ matrix.shard }}"

      - name: Save test-result cache
        if: success() && env.TEST_CACHE_WRITE == 'true' && steps.test-cache-run.outputs.stored == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: trusted-${{ steps.test-cache-key.outputs.key }}
          path: ${{ steps.test-cache-pack.outputs.archive }}
          retention-days: 30
          if-no-files-found: error

      - name: Upload test-result cache record
        if: always() && env.TEST_CACHE_REPORT != ''
        uses: actions/upload-artifact@v7
        with:
          name: test-cache-webkit-${{ matrix.shard }}
          path: ${{ env.TEST_CACHE_REPORT }}/
          if-no-files-found: ignore

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-webkit-${{ matrix.shard }}
          path: playwright-report/
          if-no-files-found: ignore

  # WebKit is also a protected context: every shard must complete successfully.
  webkit:
    if: always()
    needs: [changes, webkit-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Diagnostics only: name each upstream shard's result and the step a
      # failed or cancelled one stopped at. The check below decides.
      - uses: actions/checkout@v7
        continue-on-error: true
        with:
          sparse-checkout: scripts
      - name: Report upstream job results
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-jobs.mjs report webkit-tests

      - name: Require all WebKit browser outcomes
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          WEBKIT: ${{ needs.changes.outputs.webkit }}
          WEBKIT_RESULT: ${{ needs.webkit-tests.result }}
        run: |
          ok=true
          expect() {
            if [ "$2" = "$3" ]; then
              echo "$1: $2"
            else
              echo "::error title=$1 $2::$1 is $2, expected $3"
              ok=false
            fi
          }
          # A job is skipped only when its selection is NONE (or on a docs-only PR).
          selected() { [ "$1" = NONE ] && echo skipped || echo success; }
          expect changes "$CHANGES_RESULT" success
          if [ "$CODE" = true ]; then
            expect webkit-tests "$WEBKIT_RESULT" "$(selected "$WEBKIT")"
          else
            expect webkit-tests "$WEBKIT_RESULT" skipped
          fi
          $ok

  # The default-feature and opt-in feature suites each compile a different lib
  # test binary and run the full ~6 min lib suite, so run them on parallel
  # runners rather than back to back (#1123). Both stay full passes:
  # `not(feature = "durable-recovery")` tests exist only in the default suite.
  rust-suite:
    name: rust-suite (${{ matrix.suite }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # A cold cache build plus the lib suite has exceeded 30 minutes.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # --features avif keeps the (default-off) AVIF code linted and
          # tested; this runner has a current dav1d. The release build ships
          # without it.
          - suite: default
            clippy-features: avif
            test-features: avif
          # Keep the deferred recovery policy verified without enabling it in
          # release artifacts. Default-policy capacity coverage runs in the
          # default suite. durable-recovery is read only on Linux, like this
          # runner (ADR 0020). e2e-hooks (#884) rides along so the hook-build
          # branches are linted and unit-tested on Linux too; it is absent
          # from release artifacts.
          - suite: opt-in
            clippy-features: avif,durable-recovery,e2e-renderer-recovery,e2e-hooks
            test-features: avif,durable-recovery,e2e-hooks
    env:
      RUST_SELECTION: ${{ needs.changes.outputs.rust }}
      RUST_REASON: ${{ needs.changes.outputs.rust-reason }}
      # Read by scripts/ci-test-rust.sh and hashed into the test-result cache.
      RUST_SUITE: ${{ matrix.suite }}
      RUST_CLIPPY_FEATURES: ${{ matrix.clippy-features }}
      RUST_TEST_FEATURES: ${{ matrix.test-features }}
      # nasm: required by turbojpeg-sys (x86 SIMD assembler).
      # libdav1d-dev: AVIF decode (image avif-native, Linux-only feature).
      # Their candidate versions are hashed into the test-result cache.
      TEST_CACHE_APT_PACKAGES: libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev nasm libdav1d-dev
    steps:
      - uses: actions/checkout@v7

      # Turborepo, which hashes the suite's inputs, is a devDependency.
      - uses: oven-sh/setup-bun@v2
        if: env.RUST_SELECTION != 'NONE'
        with:
          bun-version: latest

      - name: Install dependencies
        if: env.RUST_SELECTION != 'NONE'
        run: bun install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable
        if: env.RUST_SELECTION != 'NONE'
        with:
          components: rustfmt, clippy

      # Refreshed before the cache probe so the hashed apt versions are the
      # ones a miss installs.
      - name: Refresh apt package index
        if: env.RUST_SELECTION != 'NONE'
        run: sudo apt-get update

      - name: Test-result cache key
        id: test-cache-key
        if: env.RUST_SELECTION != 'NONE'
        run: node scripts/test-cache.mjs key --target "rust-${{ matrix.suite }}"

      - name: Restore test-result cache
        if: env.RUST_SELECTION != 'NONE'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/test-cache.mjs restore --target "rust-${{ matrix.suite }}"

      # A hit replays the suite's passing result, so neither the system
      # libraries nor the ~1.5 GB build cache are needed.
      - name: Probe test-result cache
        id: test-cache-probe
        if: env.RUST_SELECTION != 'NONE'
        run: node scripts/test-cache.mjs probe --task ci:rust --target "rust-${{ matrix.suite }}"

      - name: Install Tauri Linux system dependencies
        if: env.RUST_SELECTION != 'NONE' && steps.test-cache-probe.outputs.hit != 'true'
        run: sudo apt-get install -y $TEST_CACHE_APT_PACKAGES

      # Each suite builds different feature artifacts; separate cache keys
      # keep the two matrix jobs from overwriting each other's target dir.
      # Save only from dev so PR branches restore dev's caches instead of
      # adding ~1.5 GB entries each and evicting other workflows' caches.
      - uses: Swatinem/rust-cache@v2
        if: env.RUST_SELECTION != 'NONE' && steps.test-cache-probe.outputs.hit != 'true'
        with:
          workspaces: src-tauri
          key: ${{ matrix.suite }}
          save-if: ${{ github.ref == 'refs/heads/dev' }}

      # tauri::generate_context! requires the frontendDist dir to exist.
      - name: Create empty frontend dist
        if: env.RUST_SELECTION != 'NONE'
        run: mkdir -p build

      # scripts/ci-test-rust.sh runs fmt (default suite), clippy and the tests,
      # or the cache replays an unchanged passing result. PRs test only the
      # packages the diff touches plus their dependents (scripts/rust-affected.mjs,
      # from cargo metadata); NONE also skips the toolchain, build and clippy.
      # Other events run everything.
      - name: Rust tests
        id: test-cache-run
        run: |
          case "$RUST_SELECTION" in
            ALL)
              echo "Rust tests: full suite ($RUST_REASON)" ;;
            NONE)
              echo "Rust tests: none selected ($RUST_REASON)"
              exit 0 ;;
            *)
              echo "Rust tests: selected packages $RUST_SELECTION ($RUST_REASON)" ;;
          esac
          node scripts/test-cache.mjs run --task ci:rust --target "rust-${{ matrix.suite }}"

      - name: Pack test-result cache
        id: test-cache-pack
        if: success() && env.TEST_CACHE_WRITE == 'true' && steps.test-cache-run.outputs.stored == 'true'
        run: node scripts/test-cache.mjs pack --target "rust-${{ matrix.suite }}"

      - name: Save test-result cache
        if: success() && env.TEST_CACHE_WRITE == 'true' && steps.test-cache-run.outputs.stored == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: trusted-${{ steps.test-cache-key.outputs.key }}
          path: ${{ steps.test-cache-pack.outputs.archive }}
          retention-days: 30
          if-no-files-found: error

      - name: Upload test-result cache record
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-cache-rust-${{ matrix.suite }}
          path: ${{ runner.temp }}/test-cache-report/
          if-no-files-found: ignore

  # Preserve the protected-branch check name and require every Rust suite.
  rust:
    if: always()
    needs: [changes, rust-suite]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Diagnostics only: name each suite's result and the step a failed or
      # cancelled one stopped at. The check below decides.
      - uses: actions/checkout@v7
        continue-on-error: true
        with:
          sparse-checkout: scripts
      - name: Report upstream job results
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-jobs.mjs report rust-suite

      # Skipped only on a docs-only PR; on code every suite must succeed, so a
      # failed, cancelled or skipped suite still fails this check. A Rust NONE
      # selection still runs the job; its steps skip themselves.
      - name: Require all Rust suite outcomes
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          RUST_RESULT: ${{ needs.rust-suite.result }}
        run: |
          test "$CHANGES_RESULT" = success
          if [ "$CODE" = true ]; then
            test "$RUST_RESULT" = success
          else
            test "$RUST_RESULT" = skipped
          fi

  # Hit rate and runner time across every cached test target (#1176). Each
  # target uploads one record; targets that ran nothing upload none.
  test-cache:
    if: always()
    needs: [changes, frontend-checks, chromium, chromium-view-modes, webkit-tests, rust-suite]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts

      - uses: actions/download-artifact@v8
        with:
          pattern: test-cache-*
          path: ${{ runner.temp }}/test-cache-report
          merge-multiple: true

      - name: Report test-result cache hit rate
        run: node scripts/test-cache.mjs report "$RUNNER_TEMP/test-cache-report"
