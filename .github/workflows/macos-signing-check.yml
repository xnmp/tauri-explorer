# Manual end-to-end check of macOS Developer ID signing and notarization
# (#1671): builds the release DMG exactly as release.yml does, requires
# credentials, and uploads the notarized DMG without tagging or publishing.
# Run it after adding or rotating the APPLE_* secrets (docs/macos-signing.md):
#   gh workflow run macos-signing-check.yml --ref dev
name: macOS signing check

on:
  workflow_dispatch:
  # TEMPORARY: workflow_dispatch only works once this file is on dev; this
  # trigger qualifies PR #1672 before merge. Remove before merging.
  push:
    branches: [chore/macos-notarized-releases]

permissions:
  contents: read

concurrency:
  group: macos-signing-check
  cancel-in-progress: true

jobs:
  sign:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      # Own key prefix: this runs on dev (the default branch), whose caches main
      # can restore. Sharing release.yml's macOS-cargo-tauri-* key would let
      # this run seed the release job's tauri-cli binary, which
      # `cargo install … || true` then never upgrades.
      - name: Cache cargo registry and tauri-cli
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-tauri
          key: signing-check-${{ runner.os }}-cargo-tauri-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: signing-check-${{ runner.os }}-cargo-tauri-

      - name: Install tauri-cli
        shell: bash
        run: cargo install tauri-cli --locked || true

      - name: Install frontend dependencies
        shell: bash
        run: bun install --frozen-lockfile

      - name: Build, sign and notarize Tauri app
        shell: bash
        timeout-minutes: 75
        env:
          REQUIRE_SIGNING: "1"
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: scripts/macos-release-build.sh aarch64-apple-darwin

      - name: Upload notarized DMG
        uses: actions/upload-artifact@v7
        with:
          name: notarized-dmg
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 7
