name: Bug report
description: Something broke or behaved wrong
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Tip: use **Command Palette → "Report Issue"** in the app. It includes your OS and app version when you submit, and can attach images you choose. The issue and images are public; logs are not attached automatically.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
      placeholder: "Dragged a folder onto the sidebar and…"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: The release or installer filename you downloaded
      placeholder: "v1.11.1"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux (X11)
        - Linux (Wayland)
        - Windows
        - macOS
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / crash report
      description: If the app crashed, the next launch offers a locally saved crash report — paste it here.
      render: text
