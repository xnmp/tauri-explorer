name: Tauri binary E2E (smoke)

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

# Note: macOS is deliberately omitted. Official `tauri-driver` has no
# WKWebView support (tauri-apps/tauri#7068). Re-add when a stable driver
# exists or if macOS regressions justify the CrabNebula subscription.
jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + tauri-driver binary
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/tauri-driver
            ~/.cargo/bin/tauri-driver.exe
          key: ${{ runner.os }}-tauri-driver-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-tauri-driver-

      - name: Cache Rust target
        uses: actions/cache@v4
        with:
          path: src-tauri/target
          key: ${{ runner.os }}-target-debug-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-target-debug-

      - name: Install Linux WebKit driver
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev webkit2gtk-driver xvfb

      - name: Install tauri-driver
        shell: bash
        run: cargo install tauri-driver --locked || true

      # bun.lock is resolved on Linux; delete it so each runner resolves
      # platform-specific optional deps (rollup, tauri-cli) correctly.
      - name: Install frontend dependencies
        shell: bash
        run: |
          rm -f bun.lock
          bun install

      - name: Build frontend
        run: bun run build

      - name: Build Tauri binary (debug, no bundle)
        shell: bash
        run: cargo build --manifest-path src-tauri/Cargo.toml

      - name: Run smoke suite (Linux, under Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a --server-args="-screen 0 1280x1024x24" bun run test:e2e:tauri

      - name: Run smoke suite (Windows)
        if: runner.os == 'Windows'
        run: bun run test:e2e:tauri

      - name: Upload WDIO logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wdio-logs-${{ matrix.os }}
          path: |
            logs/
            e2e-tauri/logs/
          if-no-files-found: ignore
