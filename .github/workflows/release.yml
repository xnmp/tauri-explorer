name: Build & Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  version-check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag_exists: ${{ steps.check.outputs.exists }}
    steps:
      - uses: actions/checkout@v7
      - id: ver
        run: echo "version=v$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"
      - id: check
        run: |
          if git ls-remote --tags origin "${{ steps.ver.outputs.version }}" | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: version-check
    if: needs.version-check.outputs.tag_exists == 'false'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact-name: linux-bundles
            artifact-paths: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/rpm/*.rpm
              src-tauri/target/release/bundle/appimage/*.AppImage
          - os: macos-latest
            artifact-name: macos-arm64-bundles
            rust-target: aarch64-apple-darwin
            tauri-args: --target aarch64-apple-darwin
            artifact-paths: |
              src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          - os: windows-latest
            artifact-name: windows-bundles
            artifact-paths: |
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/nsis/*-setup.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Cache cargo registry and tauri-cli
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-tauri
            ~/.cargo/bin/cargo-tauri.exe
          key: ${{ runner.os }}-cargo-tauri-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-tauri-

      - name: Install tauri-cli
        shell: bash
        run: cargo install tauri-cli --locked || true

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            nasm

      # bun.lock records optional packages for every supported platform and
      # selects the matching binaries on each runner. Keep it so the Tauri API
      # minor version stays aligned with the Rust crate during release builds.
      - name: Install frontend dependencies
        shell: bash
        run: bun install --frozen-lockfile

      - name: Build Tauri app
        shell: bash
        run: cargo tauri build ${{ matrix.tauri-args }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-paths }}
          if-no-files-found: error

  release:
    needs: [version-check, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Validate release asset matrix
        shell: bash
        env:
          VERSION: ${{ needs.version-check.outputs.version }}
        run: |
          set -euo pipefail
          version=${VERSION#v}
          version_regex=${version//./[.]}
          # These names and architectures are the output of this build matrix.
          # Check every selected file, including duplicates, before publishing.
          for pattern in '*.deb' '*.rpm' '*.AppImage' '*.dmg' '*.msi' '*-setup.exe'; do
            mapfile -d '' -t matches < <(find artifacts -type f -name "$pattern" -print0)
            if (( ${#matches[@]} != 1 )); then
              echo "::error::Expected exactly one release bundle matching $pattern; found ${#matches[@]}"
              exit 1
            fi
            for asset in "${matches[@]}"; do
              filename=$(basename "$asset")
              case "$pattern" in
                '*.deb') expected="tauri-explorer_${version}_amd64.deb" ;;
                '*.AppImage') expected="tauri-explorer_${version}_amd64.AppImage" ;;
                '*.dmg') expected="tauri-explorer_${version}_aarch64.dmg" ;;
                '*.msi') expected="tauri-explorer_${version}_x64_en-US.msi" ;;
                '*-setup.exe') expected="tauri-explorer_${version}_x64-setup.exe" ;;
                '*.rpm') expected='' ;;
              esac
              if [[ "$pattern" == '*.rpm' ]]; then
                [[ "$filename" =~ ^tauri-explorer-${version_regex}-[0-9]+\.x86_64\.rpm$ ]] && continue
              elif [[ "$filename" == "$expected" ]]; then
                continue
              fi
              echo "::error::Release bundle has the wrong version: $asset"
              exit 1
            done
          done

      - name: Prepare release notes
        env:
          VERSION: ${{ needs.version-check.outputs.version }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from datetime import date
          from pathlib import Path

          version = os.environ['VERSION']
          changelog = Path('CHANGELOG.md').read_text()
          section = re.search(
              rf'(?ms)^## {re.escape(version)} — ([^\n]+)\n(.*?)(?=^## |\Z)',
              changelog,
          )
          if section is None:
              raise SystemExit(f'No changelog section for {version}')
          date_text, body = section.groups()
          if not re.fullmatch(r'\d{4}-\d{2}-\d{2}', date_text):
              raise SystemExit(f'Changelog entry for {version} must be dated')
          try:
              date.fromisoformat(date_text)
          except ValueError:
              raise SystemExit(f'Changelog entry for {version} must be dated')
          if not body.strip():
              raise SystemExit(f'Changelog entry for {version} is empty')
          Path('release-notes.md').write_text(body.strip() + '\n')
          PY

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version-check.outputs.version }}
        run: |
          mapfile -t assets < <(find artifacts -type f \( \
            -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \
            -o -name '*.dmg' \
            -o -name '*.msi' -o -name '*-setup.exe' \))
          gh release create "$VERSION" \
            --title "$VERSION" \
            --target "$GITHUB_SHA" \
            --notes-file release-notes.md \
            "${assets[@]}"
