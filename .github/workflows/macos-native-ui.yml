name: macOS Native UI

# The hosted Mac pilot is the most expensive job and is not a required check.
# It runs on dev pushes that change the app and nightly to catch WKWebView
# regressions (#1133, #1801).
on:
  push:
    branches: [dev]
    # Path-scoped on dev pushes (#1801); the nightly schedule and dispatch
    # run regardless, catching anything outside these paths within a day.
    # The full app build (frontend, Rust, the scripts it runs) plus the
    # native suite that drives it.
    paths:
      - "src/**"
      - "src-tauri/**"
      - "static/**"
      - "tests/contract/fixtures/**"
      - "tests/fixtures/**"
      - "package.json"
      - "bun.lock"
      - "vite.config.ts"
      - "svelte.config.js"
      - "tsconfig.json"
      - "scripts/**"
      - "e2e-tauri/**"
      - ".github/workflows/macos-native-ui.yml"
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

# PRs share a group per PR ref and dev pushes one group per workflow, both
# cancelling in progress: a newer commit cancels its superseded run (#1798).
# Every other event (main pushes, schedule, dispatch) gets a unique run-ID
# group, so it never cancels or replaces another run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || (github.event_name == 'push' && github.ref == 'refs/heads/dev') && 'dev-push' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/dev') }}

jobs:
  native-ui:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          # Scheduled runs use the default branch (dev); name it explicitly anyway.
          ref: ${{ github.event_name == 'schedule' && 'dev' || '' }}

      - name: Record hosted Mac environment
        run: |
          mkdir -p qualification-results/macos-native-ui
          printf 'runner=%s\narch=%s\nsource=%s\n' "$RUNNER_OS" "$RUNNER_ARCH" "$GITHUB_SHA" > qualification-results/macos-native-ui/host.txt
          sw_vers >> qualification-results/macos-native-ui/host.txt
          xcodebuild -version >> qualification-results/macos-native-ui/host.txt
          xcode-select -p >> qualification-results/macos-native-ui/host.txt
          csrutil status >> qualification-results/macos-native-ui/host.txt 2>&1 || true

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable

      - name: Record Rust compiler identity
        id: rust-provenance
        run: |
          echo "cache-key=$(rustc -Vv | shasum -a 256 | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: macos-native-ui-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-provenance.outputs.cache-key }}-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml', 'src-tauri/tauri.conf.json') }}

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install and verify native screenshot oracle
        run: |
          python -m pip install --disable-pip-version-check Pillow==12.3.0
          python -m unittest discover -s e2e-tauri -p test_pdf_screenshot.py

      - name: Install pinned Appium Mac2 driver
        run: |
          npm install --global appium@3.8.0
          appium driver install mac2@4.2.0

      - name: Grant XCTest Accessibility on this disposable runner
        run: |
          helper="$(xcode-select -p)/Platforms/MacOSX.platform/Developer/Library/Xcode/Agents/Xcode Helper.app/Contents/MacOS/Xcode Helper"
          bash scripts/grant-macos-accessibility.sh "$helper"
          sudo automationmodetool enable-automationmode-without-authentication || echo '::warning::Could not suppress an automation prompt; the native session remains the qualification gate'
          appium driver doctor mac2

      - name: Build production WKWebView application bundle
        env:
          VITE_E2E_HOOKS: '0'
        run: bun run tauri build --bundles app

      - name: Assert native listing, navigation and PDF preview outcomes
        run: |
          mkdir -p qualification-results/macos-native-ui
          appium --address 127.0.0.1 --port 4723 > qualification-results/macos-native-ui/appium.log 2>&1 &
          appium_pid=$!
          trap 'kill "$appium_pid" 2>/dev/null || true; wait "$appium_pid" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4723/status > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4723/status > /dev/null
          bun run e2e-tauri/macos-ui-smoke.ts

      - name: Upload macOS native UI evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-native-ui
          path: qualification-results/macos-native-ui/
          if-no-files-found: error
