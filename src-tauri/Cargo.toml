[package]
name = "tauri-explorer"
version = "0.4.0"
description = "A minimalistic, high-performance file explorer"
authors = ["you"]
edition = "2021"

[lib]
name = "tauri_explorer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-drag = "2"
tauri-plugin-clipboard-x = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trash = "5"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
fs_extra = "1.3"
opener = "0.7"
nucleo-matcher = "0.3"
jwalk = "0.8"
grep-regex = "0.1"
grep-searcher = "0.1"
grep-matcher = "0.1"
ignore = "0.4"
regex = "1"
num_cpus = "1"
thiserror = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }
icns = "0.3"
turbojpeg = { version = "1", features = ["image"] }
lru = "0.12"
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"
zip = { version = "2", default-features = false, features = ["deflate", "deflate64", "bzip2", "zstd", "lzma"] }
tokio = { version = "1", features = ["rt", "time", "sync", "process"] }
notify = "7"
git2 = { version = "0.20", default-features = false, features = ["vendored-libgit2"] }
libc = "0.2.183"
log = "0.4"
tauri-plugin-log = "2"

[features]
# AVIF thumbnails/previews, via image's avif-native decoder (system dav1d).
# Off by default so the cross-platform release build needs no dav1d (Ubuntu
# 22.04's is too old, and bundling it into the AppImage/deb is a headache).
# The Arch PKGBUILD enables it — Arch ships a current dav1d. Code paths are
# gated on `#[cfg(feature = "avif")]`.
avif = ["image/avif-native"]

# zbus/url: xdg-desktop-portal FileChooser backend (system file picker).
# Pure-Rust (zbus) + no system deps, so safe to build everywhere Linux.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["tokio"] }
url = "2"

[dev-dependencies]
tempfile = "3"

# Compile dependencies optimized even in dev builds. The content-search stack
# (regex, grep-searcher, ignore) is 10-50x slower at opt-level 0, which made
# Ctrl+Shift+F crawl under `tauri dev`; image/turbojpeg thumbnailing suffers
# similarly. Our own crate stays at opt-level 0 for fast incremental rebuilds.
[profile.dev.package."*"]
opt-level = 3

