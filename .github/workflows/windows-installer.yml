name: Windows installer

on:
  # PRs run only required checks (tauri#1133); this platform workflow keeps a
  # PR trigger for its Windows-specific files. README edits run on dev.
  pull_request:
    paths:
      - windows_install.ps1
      - tests/windows-install-script.test.ts
      - .github/workflows/windows-installer.yml
  push:
    branches: [dev]
    paths:
      - windows_install.ps1
      - tests/windows-install-script.test.ts
      - README.md
      - .github/workflows/windows-installer.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  invocation:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bunx vitest run tests/windows-install-script.test.ts
